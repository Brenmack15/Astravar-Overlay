name: Isolated item customization evidence
on:
  push:
    branches: [verification/ascension-holding-sources-20261127]
permissions:
  actions: read
  contents: read
  statuses: write
jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Link this isolated evidence run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=isolated-holding \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Reading the synthetic verification archive' --silent
      - name: Inspect the original private synthetic development XML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="/repos/$GITHUB_REPOSITORY/actions/artifacts/15169060090"
          test "$(gh api "$base" --jq '.workflow_run.id')" = "45929908129"
          gh api "$base/zip" > "$RUNNER_TEMP/holding.zip"
          python3 - <<'PY'
          import os, zipfile
          from xml.etree import ElementTree as ET
          with zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'],'holding.zip')) as z:
              members=[p for p in z.namelist() if "CloudItemCustomization" in p]
              print("Original structured members",members)
              for p in members:
                  if not p.endswith(".xml"):continue
                  suite=ET.fromstring(z.read(p)); tests=suite.findall("testcase")
                  for test in tests:
                      failure=test.find("failure")
                      if failure is not None:
                          print(test.get("name")); print((failure.text or "")[:5200])
              if not members:
                  names=[n for n in z.namelist() if "summary" in n or "fail" in n or n.endswith(".xml")]
                  print("Failure evidence members",names[:100])
                  for n in names:
                      if ('summary' in n or 'fail' in n) and not n.endswith('/'):
                          records=z.read(n).decode('utf-8','replace').splitlines()
                          for i,v in enumerate(records):
                              if 'Revised survey marker' in v or 'CloudItemCustomizationInteropTest.sharedCatalog' in v:
                                  for line in records[max(0,i-1):i+4]:print(line[:1400])
          PY
      - name: Record the archive inspection result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATE: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATE" = success ]; then state=success; fi
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=isolated-holding \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Synthetic archive inspection complete' --silent
  focused:
    if: contains(github.event.head_commit.message, '[test holdings]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - uses: ./.github/actions/robolectric-runtime
      - run: bash scripts/ci-android-sdk.sh
      - name: Repeat ordinary connected workflows and verify individual outcomes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/holding-screens"
          for iteration in 1 2 3; do
            bash gradlew --console=plain --build-cache :app:testDebugUnitTest --rerun \
              --tests '*CloudItemCustomizationInteropTest' --tests '*CloudRecordScreensTest' \
              --tests '*CloudInventionGenealogyInteropTest' --tests '*CloudWorldChronicleInteropTest' \
              --tests '*CloudOwnerRecoveryInteropTest' -PastravarScreenshots="$RUNNER_TEMP/holding-screens"
            python3 - "$iteration" <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import sys
          for x in sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml")):
              root = ET.parse(x).getroot()
              assert all(int(root.get(k,0)) == 0 for k in ("failures","errors","skipped"))
              if int(root.get("tests",0)):
                  print("Iteration", sys.argv[1], root.get("name"), root.get("tests"), root.get("time"))
          PY
          done
      - name: Retain failing or successful JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-holding-junit
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
