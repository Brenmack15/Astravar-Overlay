name: Verify actual stock TalkBack navigation on the synthetic actor
on:
  push:
    branches: ['verification/ascension-stock-talkback-20261127']
    paths:
      - '.github/workflows/qa-talkback-journey.yml'
      - 'app/src/androidTest/java/com/yazsras/astravar/ui/AscensionStockTalkBackTest.kt'
permissions:
  contents: read
jobs:
  talkback:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Locate Android SDK and package tools
        run: bash scripts/ci-android-sdk.sh
      - name: Build the synthetic native test and unmodified product
        run: bash gradlew --console=plain --build-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot a fresh official Play SDK image and enable its original signed screen reader
        id: actual
        timeout-minutes: 19
        env:
          QA_IMAGE: system-images;android-37.0;google_apis_playstore;x86_64
        run: |
          set -euo pipefail
          mkdir -p validation/talkback
          report="$GITHUB_WORKSPACE/validation/talkback"
          git rev-parse HEAD > "$report/source.txt"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          timeout -k 5s 80s sdkmanager --licenses < <(printf 'y\n%.0s' {1..100}) >/dev/null
          timeout -k 10s 540s sdkmanager emulator "$QA_IMAGE" > "$RUNNER_TEMP/reader-sdk.txt"
          grep -E '^Pkg.Revision=|^SystemImage.TagId=|^SystemImage.Abi=|^AndroidVersion.ApiLevel=' "$ANDROID_HOME/system-images/android-37.0/google_apis_playstore/x86_64/source.properties" | tee "$report/stock-image.txt"
          qemu="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          if ldd "$qemu" | grep -F 'libpulse.so.0 => not found' >/dev/null; then sudo apt-get -qq update; sudo apt-get -qy install --no-install-recommends libpulse0; fi
          test -c /dev/kvm && sudo chmod a+rw /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/stock-reader-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd=AstravarStockReader
          serial=emulator-5582
          device() { adb -s "$serial" "$@"; }
          if adb devices | awk -v s="$serial" '$1==s{found=1}END{exit !found}'; then exit 1; fi
          printf 'no\n' | avdmanager create avd -f -n "$avd" -k "$QA_IMAGE" --device pixel_8
          "$ANDROID_HOME/emulator/emulator" -avd "$avd" -port 5582 -grpc-use-token -accel on -no-window -no-audio -no-snapshot -no-boot-anim -memory 4096 -gpu swiftshader > "$RUNNER_TEMP/stock-reader-emulator.log" 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          timeout 140 adb -s "$serial" wait-for-device
          for _ in $(seq 1 110); do kill -0 "$qemu_pid"; if test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1; then break; fi; sleep 2; done
          test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(device shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$(device shell getprop ro.build.version.sdk | tr -d '\r')" = 37
          test "$(device emu avd name | tr -d '\r' | head -1)" = "$avd"
          device shell settings put global device_provisioned 1
          device shell settings put secure user_setup_complete 1
          device shell cmd statusbar collapse
          device shell input keyevent KEYCODE_WAKEUP
          device shell wm dismiss-keyguard
          device shell wm size reset
          device shell wm density 300
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do device shell settings put global "$setting" 0; done
          device install app/build/outputs/apk/debug/app-debug.apk
          device install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          service=com.google.android.marvin.talkback/.TalkBackService
          device shell cmd package query-services --brief --components --user 0 -a android.accessibilityservice.AccessibilityService | tr -d '\r' | grep -Fx "$service" | tee "$report/reader-service.txt"
          device shell cmd package query-services --brief --components --user 0 -a android.intent.action.TTS_SERVICE | tr -d '\r' | tee "$report/tts-service.txt"
          device shell settings put secure enabled_accessibility_services "$service"
          device shell settings put secure accessibility_enabled 1
          for _ in $(seq 1 60); do device shell dumpsys accessibility | tr -d '\r' > "$RUNNER_TEMP/reader-state.txt"; if grep -q 'touchExplorationEnabled=true' "$RUNNER_TEMP/reader-state.txt" && grep -q 'Bound services:.*label=TalkBack' "$RUNNER_TEMP/reader-state.txt"; then break; fi; sleep 1; done
          awk '/attributes:.*touchExplorationEnabled|Bound services:/{print}' "$RUNNER_TEMP/reader-state.txt" | tee "$report/reader-state.txt"
          grep -q 'Bound services:.*label=TalkBack' "$report/reader-state.txt"
          grep -q 'touchExplorationEnabled=true' "$report/reader-state.txt"
          device shell input keyevent KEYCODE_HOME
          device shell wm dismiss-keyguard
          target=com.yazsras.astravar.v2uidebug
          testclass=com.yazsras.astravar.ui.AscensionStockTalkBackTest
          python3 -m venv "$RUNNER_TEMP/reader-env"
          "$RUNNER_TEMP/reader-env/bin/python" -m pip install --quiet --disable-pip-version-check grpcio-tools==1.74.0
          mkdir -p "$RUNNER_TEMP/reader-proto"
          proto=$(find "$ANDROID_HOME/emulator" -name emulator_controller.proto -type f | head -1)
          test -f "$proto"
          "$RUNNER_TEMP/reader-env/bin/python" -m grpc_tools.protoc -I"$(dirname "$proto")" --python_out="$RUNNER_TEMP/reader-proto" --grpc_python_out="$RUNNER_TEMP/reader-proto" "$proto"
          export PYTHONPATH="$RUNNER_TEMP/reader-proto"
          timeout -k 5s 220s "$RUNNER_TEMP/reader-env/bin/python" scripts/ci-stock-reader-hardware.py | tee "$report/native-result.txt"
          grep -q '^OK (1 test)' "$report/native-result.txt"
          ! grep -qE 'FAILURES|INSTRUMENTATION_FAILED|Process crashed' "$report/native-result.txt"
          device pull "/sdcard/Android/data/$target/files/talkback-proof.json" "$report/reader-proof.json" >/dev/null
          python3 - "$report" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path(sys.argv[1]);d=json.loads((p/'reader-proof.json').read_text()); assert d['api']==37 and d['touchExplorationEnabled'] and d['rollsAfterOpeningOptions']==0 and d['rollsAfterDoubleTap']==1 and d['certificateSha256']=='7b5ad55180a48a1f30f35377c0f9e5f911bf942fb4cf83eba255a0ebf580beef'
          assert d['service'].startswith('com.google.android.marvin.talkback/') and d['actorId']=='qa-reader-actor' and d['subject']=='STR' and d['owner']=='Player' and 1<=d['face']<=20 and d['total']==d['face']+3
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stock-talkback-native-evidence
          path: validation/talkback/
          retention-days: 7
