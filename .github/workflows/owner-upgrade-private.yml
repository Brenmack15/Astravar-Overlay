name: Private original-owner upgrade verification
# Ordinary checkpoint pushes are inert. Root must fill every reviewed pin, set
# enabled:true, and intentionally use this exact subject on this isolated branch.
on:
  push:
    branches: ['checkpoint/astravar-genesis-owner-upgrade-envelope-20261112']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: original-owner-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  receive-and-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: receive reviewed owner upgrade envelope'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check explicit reviewed enablement
        id: enabled
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('scripts/owner-upgrade-config.json'))
          enabled = config.get('enabled') is True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('value=' + str(enabled).lower() + '\n')
          print('Reviewed transport enabled.' if enabled else 'Disabled checkpoint: no key generation, download, emulator or transfer.')
          PY
      - name: Install isolated hash-pinned transport dependency
        if: steps.enabled.outputs.value == 'true'
        timeout-minutes: 4
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/owner-upgrade-venv"
          "$RUNNER_TEMP/owner-upgrade-venv/bin/pip" --disable-pip-version-check install --only-binary=:all: --require-hashes -r scripts/owner-upgrade-requirements.txt
          echo "$RUNNER_TEMP/owner-upgrade-venv/bin" >> "$GITHUB_PATH"
      - name: Synthetic transport regressions
        if: steps.enabled.outputs.value == 'true'
        timeout-minutes: 3
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_owner_upgrade*.py' -v
          python3 scripts/owner_upgrade_transfer.py check
          bash -n scripts/ci-owner-upgrade.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.enabled.outputs.value == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare official accelerated Android 36 environment
        if: steps.enabled.outputs.value == 'true'
        timeout-minutes: 13
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_HOME="$RUNNER_TEMP/owner-upgrade-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --connect-timeout 15 --max-time 150 -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/owner-upgrade-sdk.zip"
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$RUNNER_TEMP/owner-upgrade-sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/owner-upgrade-sdk.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf 'y\n%.0s' {1..100} | timeout -k 5s 120s sdkmanager --licenses >/dev/null
          timeout -k 10s 540s sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-36;google_apis;x86_64'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Verify live source gates and create ephemeral transport recipient
        if: steps.enabled.outputs.value == 'true'
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          python3 scripts/owner_upgrade_transfer.py prepare --private "$RUNNER_TEMP/owner-upgrade-private" --public "$RUNNER_TEMP/owner-upgrade-public"
      - name: Publish only the public recipient descriptor
        if: steps.enabled.outputs.value == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-upgrade-recipient-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-upgrade-public/recipient.json
          if-no-files-found: error
          retention-days: 1
      - name: Receive ciphertext and validate exact source APKs privately
        if: steps.enabled.outputs.value == 'true'
        timeout-minutes: 29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          timeout -k 15s 1680s python3 scripts/owner_upgrade_transfer.py receive --private "$RUNNER_TEMP/owner-upgrade-private" --public "$RUNNER_TEMP/owner-upgrade-public" --sdk "$ANDROID_HOME"
      - name: Original owner 49 to 50 installation and independent retention
        if: steps.enabled.outputs.value == 'true'
        timeout-minutes: 41
        env:
          OWNER_UPGRADE_APPROVED: '1'
          OWNER_UPGRADE_PRIVATE: ${{ runner.temp }}/owner-upgrade-private/apks
          OWNER_UPGRADE_EVIDENCE: ${{ runner.temp }}/owner-upgrade-public/native-evidence
        run: timeout -k 20s 2400s bash scripts/ci-owner-upgrade.sh
      - name: Reject publication leakage
        if: always() && steps.enabled.outputs.value == 'true'
        id: publication
        run: |
          python3 scripts/owner_upgrade_publication.py "$RUNNER_TEMP/owner-upgrade-public"
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Upload only explicit synthetic evidence and public metadata
        if: always() && steps.publication.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-owner-upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owner-upgrade-public/transport-result.json
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/native-result.json
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/native-seedCode49.txt
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/native-verifyAfterUpgrade.txt
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/native-canonicalWriteSurvivesRestart.txt
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/genesis-before-code49-sheet.png
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/genesis-after-code50-sheet.png
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/genesis-upgrade-companion.png
            ${{ runner.temp }}/owner-upgrade-public/native-evidence/genesis-canonical-write-after-restart.png
          if-no-files-found: warn
          retention-days: 14
      - name: Remove this attempt's private transport key and APK copies
        if: always() && steps.enabled.outputs.value == 'true'
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          target = root / 'owner-upgrade-private'
          if target.is_symlink():
              raise SystemExit('Refusing redirected private cleanup')
          if target.exists():
              shutil.rmtree(target)
          PY
