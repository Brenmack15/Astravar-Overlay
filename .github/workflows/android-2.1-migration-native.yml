name: Astravar 2.1 migration native source verification
on:
  push:
    branches: ['feat/astravar-2.1-player-first']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astravar-21-migration-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  migration-native:
    # A separate fresh build. No incomplete or expired artifact is reused.
    # The ordinary full workflow must independently pass all unit regressions.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ci: verify migration native interfaces'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ASTRAVAR_VERSION_NAME: '2.1.0'
      ASTRAVAR_VERSION_CODE: '33'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify reviewed invention output classification and exact fresh source
        run: |
          mkdir -p validation
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          base = '1331f5ecd42bf098e654fe2d5d0b721cabb1451e'
          tree = '8872907e46b812db2ce29ea666e9966be67acba1'
          assert git('rev-parse', base+'^{tree}') == tree
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          assert not git('status', '--porcelain', '--untracked-files=all')
          changed = git('diff', '--name-only', '--no-renames', base, 'HEAD').splitlines()
          allowed = {
              '.github/workflows/android-2.1-migration-native.yml',
              '.github/workflows/android-2.1.yml',
              'app/build.gradle.kts',
              'app/src/main/java/com/yazsras/astravar/ui/CampaignPagesV2.kt',
              'app/src/main/java/com/yazsras/astravar/ui/CampaignCheckpointsV21.kt',
              'app/src/test/java/com/yazsras/astravar/ui/CampaignPagesV2Test.kt',
              'overlay-target/src/androidTest/java/com/yazsras/astravar/CampaignImportInstrumentationTest.kt',
              'docs/CAMPAIGN_ARCHIVE.md',
              'scripts/ci-player-first-emulator.sh',
          }
          assert set(changed) == allowed, dict(unexpected=sorted(set(changed) - allowed), missing=sorted(allowed - set(changed)))
          proof = dict(sourceCommit=git('rev-parse','HEAD'), sourceTree=git('rev-parse','HEAD^{tree}'),
                       reviewedProjectOutputFixBaseline=base, reviewedProjectOutputFixBaselineTree=tree, changedPaths=changed,
                       ownerSigningUsed=False, realCampaignDataUsed=False,
                       scope='Fresh code33 source build of the reviewed confirmed project-output classification; no APK reuse. All unit regressions remain a separate full-workflow gate.')
          Path('validation/fresh-native-source-proof.json').write_text(json.dumps(proof, indent=2)+'\n')
          PY
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_v2_protected_source.py
          python3 scripts/verify_ui_foundation.py
          python3 scripts/verify_branding.py
          python3 scripts/verify_particle_resources.py
          python3 scripts/verify_upgrade_integrity.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install checksum-verified SDK and accelerated Android 16 emulator
        timeout-minutes: 9
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --connect-timeout 15 --max-time 150 -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf 'y\n%.0s' {1..100} | timeout -k 5s 60s sdkmanager --licenses >/dev/null
          # Both attempts share the original single 360s package-install budget.
          # Keep logs outside validation until prepare has created that directory.
          mkdir -p "$RUNNER_TEMP/astravar-sdk-install-logs"
          timeout -k 10s 360s bash <<'ASTRAVAR_SDK_INSTALL'
          set -e
          for astravar_sdk_attempt in 1 2; do
            set +e
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'system-images;android-36;google_apis;x86_64' 2>&1 | tee "$RUNNER_TEMP/astravar-sdk-install-logs/attempt-$astravar_sdk_attempt.log"
            astravar_sdk_pipeline_status=("${PIPESTATUS[@]}")
            set -e
            astravar_sdk_status=${astravar_sdk_pipeline_status[0]}
            printf 'attempt=%s sdkmanager_exit=%s log_exit=%s\n' "$astravar_sdk_attempt" "$astravar_sdk_status" "${astravar_sdk_pipeline_status[1]}" >> "$RUNNER_TEMP/astravar-sdk-install-logs/results.log"
            if test "${astravar_sdk_pipeline_status[1]}" -ne 0; then exit "${astravar_sdk_pipeline_status[1]}"; fi
            if test "$astravar_sdk_status" -eq 0; then exit 0; fi
            if test "$astravar_sdk_attempt" -eq 1; then
              # Only the incomplete installer cache in this fresh job's SDK.
              test "$ANDROID_HOME" = "$RUNNER_TEMP/android-sdk"
              rm -rf -- "$ANDROID_HOME/.temp"
            fi
          done
          exit "$astravar_sdk_status"
          ASTRAVAR_SDK_INSTALL
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/19.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build fresh baseline and migration APKs with one disposable CI signer
        timeout-minutes: 25
        run: |
          export ASTRAVAR_KEYSTORE="$RUNNER_TEMP/ci-migration-only.p12"
          export ASTRAVAR_STORE_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_ALIAS=astravar-ci
          keytool -genkeypair -noprompt -keystore "$ASTRAVAR_KEYSTORE" -storetype PKCS12 -storepass "$ASTRAVAR_STORE_PASSWORD" -keypass "$ASTRAVAR_KEY_PASSWORD" -alias "$ASTRAVAR_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Astravar migration CI only'
          trap 'rm -f "$ASTRAVAR_KEYSTORE"' EXIT
          git worktree add --detach "$RUNNER_TEMP/astravar-schema3-baseline" b02222006e631e145194609e248cbb7adf5f21db
          test "$(git -C "$RUNNER_TEMP/astravar-schema3-baseline" rev-parse HEAD)" = b02222006e631e145194609e248cbb7adf5f21db
          (cd "$RUNNER_TEMP/astravar-schema3-baseline" && ASTRAVAR_VERSION_CODE=24 bash ./gradlew --no-daemon --console=plain :app:assembleRelease)
          cp "$RUNNER_TEMP/astravar-schema3-baseline/app/build/outputs/apk/release/app-release.apk" validation/Astravar-2.1-CI-ONLY-code24.apk
          bash ./gradlew --no-daemon --console=plain :app:assembleRelease :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
          cp app/build/outputs/apk/release/app-release.apk validation/Astravar-2.1-CI-ONLY-code33.apk
          python3 scripts/inspect_release_apk.py validation/Astravar-2.1-CI-ONLY-code24.apk --package com.yazsras.astravar --version-name 2.1.0 --version-code 24 --output validation/release-code24.json
          python3 scripts/inspect_release_apk.py validation/Astravar-2.1-CI-ONLY-code33.apk --package com.yazsras.astravar --version-name 2.1.0 --version-code 33 --output validation/release-code33.json
          python3 scripts/native_recheck.py verify-targets --output validation/native-test-apks.json
          python3 - <<'PY'
          import json
          a=json.load(open('validation/release-code24.json'));b=json.load(open('validation/release-code33.json'))
          assert a['certificate_sha256']==b['certificate_sha256']
          assert b['version_code']>a['version_code']
          assert not a['owner_signature_verified'] and not b['owner_signature_verified']
          PY
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
          sha256sum validation/*.apk > validation/SHA256SUMS.txt
          printf '%s\n' 'CI TEST ONLY. Fresh disposable signer; no original owner key or real campaign data. These APKs are not phone deliverables. Never uninstall an owner app to bypass a certificate mismatch. Full unit-regression verification is a separate required gate.' >validation/CI-ONLY-NOT-A-PERMANENT-RELEASE.txt
      - name: Native update, complete archive recovery and mapped campaign interfaces
        timeout-minutes: 30
        env:
          ASTRAVAR_TEST_SIGNER_LABEL: fresh disposable CI signer; not owner signing
        run: |
          # Sourcing retains the unchanged runner's verified emulator and EXIT
          # cleanup until the supplemental typed tests and SQL reads complete.
          source scripts/ci-player-first-emulator.sh
          python3 scripts/native_recheck.py snapshot-mapped --database validation/campaign-rolled-back/astravar-campaign-ledger.db --output validation/campaign-mapped-before.json --synthetic-demo
          ASTRAVAR_NATIVE_CLASS_TIMEOUT=720 run_class CampaignImportInstrumentationTest#cMappedCampaignRecordsReachPlayerViews 1 validation/native-mapped-campaign-ui.txt
          timeout 15s adb shell am force-stop com.yazsras.astravar
          copy_campaign_database validation/campaign-mapped
          timeout 30s adb pull /sdcard/Android/data/com.yazsras.astravar.target/files/native-mapped-fixture.json validation/native-mapped-fixture.json >/dev/null
          python3 scripts/native_recheck.py verify-mapped --database validation/campaign-mapped/astravar-campaign-ledger.db --manifest validation/campaign-mapped-before.json --fixture validation/native-mapped-fixture.json --output validation/native-mapped-readback.json --synthetic-demo
          run_class CampaignImportInstrumentationTest#dMappedCampaignRecordsRollbackAfterReadback 1 validation/native-mapped-campaign-rollback.txt
          timeout 15s adb shell am force-stop com.yazsras.astravar
          copy_campaign_database validation/campaign-mapped-rolled-back
          python3 scripts/native_recheck.py verify-mapped --rolled-back --database validation/campaign-mapped-rolled-back/astravar-campaign-ledger.db --manifest validation/campaign-mapped-before.json --fixture validation/native-mapped-fixture.json --output validation/native-mapped-rollback-readback.json --synthetic-demo
      - name: Preserve SDK package-install attempt diagnostics
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/astravar-sdk-install-logs"; then
            mkdir -p validation/sdk-install
            cp -R "$RUNNER_TEMP/astravar-sdk-install-logs/." validation/sdk-install/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-2.1-migration-native-source
          path: |
            validation/
            app/build/outputs/mapping/release/mapping.txt
            overlay-target/build/reports/
          retention-days: 14
