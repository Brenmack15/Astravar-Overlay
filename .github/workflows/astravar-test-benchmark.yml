name: Astravar test worker benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astravar-test-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Use installed Android packages
        run: bash scripts/ci-android-sdk.sh
      - name: Compare identical repeated worker configurations
        run: python3 scripts/ci-benchmark-tests.py
      - name: Bind benchmark to source
        if: always()
        run: |
          mkdir -p validation/test-worker-benchmark
          git rev-parse HEAD > validation/test-worker-benchmark/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-test-worker-benchmark
          path: validation/test-worker-benchmark/
          retention-days: 14
