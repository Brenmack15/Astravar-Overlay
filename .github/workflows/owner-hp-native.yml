name: Astravar HP native HTTPS acceptance
on:
  push:
    branches: ['feat/astravar-2.1-player-first', 'feat/astravar-2.3-ultra-fast-sync']
    paths: ['app/**', 'backend/owner-bridge/**', 'scripts/ci-owner-hp-native.sh', 'scripts/ci-owner-native-server.mjs', 'scripts/ui_foundation_sha256.json', 'scripts/verify_ui_foundation.py', '.github/workflows/owner-connection.yml', '.github/workflows/owner-hp-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astravar-hp-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-hp:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      ASTRAVAR_VERSION_CODE: '39'
      ASTRAVAR_VERSION_NAME: '2.3.2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified SDK and accelerated API36 image
        timeout-minutes: 10
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/hp-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --connect-timeout 15 --max-time 150 -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/hp-android-cli.zip"
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$RUNNER_TEMP/hp-android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/hp-android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf 'y\n%.0s' {1..100} | timeout -k 5s 60s sdkmanager --licenses >/dev/null
          timeout -k 10s 420s sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'system-images;android-36;google_apis;x86_64'
          python3 scripts/normalize-android-platform.py
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/19.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Build published baseline35 and current-source candidate39 test APKs
        timeout-minutes: 35
        run: |
          git fetch --no-tags --depth=1 origin abae4f49beec75d14a364be91f7d0fb4303524ad
          git worktree add --detach "$RUNNER_TEMP/astravar-hp-baseline" abae4f49beec75d14a364be91f7d0fb4303524ad
          (cd "$RUNNER_TEMP/astravar-hp-baseline" && ASTRAVAR_VERSION_CODE=35 ASTRAVAR_VERSION_NAME=2.1.1 bash ./gradlew --no-daemon --console=plain :app:assembleDebug)
          cp "$RUNNER_TEMP/astravar-hp-baseline/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/astravar-hp-baseline35.apk"
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest
          echo "ASTRAVAR_BASELINE_DEBUG_APK=$RUNNER_TEMP/astravar-hp-baseline35.apk" >> "$GITHUB_ENV"
      - name: Native campaign Auto-Sync, TLS, AndroidKeyStore, transactions, clipboard and recovery
        timeout-minutes: 25
        run: bash scripts/ci-owner-hp-native.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-HP-native-HTTPS-fictional-evidence
          path: validation/owner-hp-native/
          retention-days: 7
