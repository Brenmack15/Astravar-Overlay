name: Focused Android 16 retained skill pins
on:
  push:
    branches: [verification/ascension-skill-pins]
    paths:
      - '.github/workflows/qa-consolidation-pin-device.yml'
      - 'scripts/qa-consolidation-pin-focus.py'
      - 'scripts/qa-consolidation-skill-readback.py'
      - 'overlay-target/src/androidTest/java/com/yazsras/astravar/GenesisConsolidationInstrumentationTest.kt'
permissions:
  contents: read
  actions: read
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Prepare the stock Android 16 image and tools
        run: |
          bash scripts/ci-android-sdk.sh native
          sudo apt-get -qq update
          sudo apt-get -qy install libpulse0
      - name: Verify source equivalence and recover the original CI APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code 5e65a4c7052fe1697cbcbd03f415b85249d09b7a HEAD -- app/src/main app/build.gradle.kts rules build.gradle.kts settings.gradle.kts
          endpoint="repos/$GITHUB_REPOSITORY/actions/artifacts/15166880758"
          gh api "$endpoint" > "$RUNNER_TEMP/pair.json"
          gh api "$endpoint/zip" > "$RUNNER_TEMP/pair.zip"
          git show 904fe8fbefbbd09244acae5db30383853058b3ef:scripts/qa-ascension-upgrade-inputs.py > "$RUNNER_TEMP/package-proof.py"
          python3 "$RUNNER_TEMP/package-proof.py" "$RUNNER_TEMP/pair.zip" "$RUNNER_TEMP/pair.json"
          mkdir -p validation/pin-proof
          mv validation/ascension-api37/provenance.json validation/pin-proof/provenance.json
      - name: Build the matching QA app and controller using the original fixture operations
        run: |
          set -euo pipefail
          python3 scripts/qa-consolidation-pin-focus.py
          project="$RUNNER_TEMP/pin-overlay"
          mkdir -p "$project/overlay-target"
          cp -r overlay-target/src overlay-target/build.gradle.kts "$project/overlay-target/"
          cp gradle.properties "$project/"
          python3 - "$project" <<'PY'
          from pathlib import Path
          import sys
          dest = Path(sys.argv[1])
          lines = Path("build.gradle.kts").read_text().splitlines()
          plugins = [l for l in lines if 'id("com.android.application")' in l or 'kotlin("android")' in l]
          assert len(plugins) == 2 and all("version" in l for l in plugins)
          (dest/"build.gradle.kts").write_text("plugins {\n" + "\n".join(plugins) + "\n}\n")
          text = Path("settings.gradle.kts").read_text()
          modules = 'include(":rules", ":app", ":overlay-target")'
          assert text.count(modules) == 1
          (dest/"settings.gradle.kts").write_text(text.replace(modules,'include(":overlay-target")'))
          PY
          bash gradlew --console=plain --build-cache --project-dir "$project" :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
          mkdir -p overlay-target/build/outputs
          cp -r "$project/overlay-target/build/outputs/apk" overlay-target/build/outputs/
      - name: Rehearse normal skill edits, pin, force-stop, rename, physical roll and deletion
        env:
          ASTRAVAR_BASELINE_APK: validation/upgrade-baseline/code58-ci.apk
          ASTRAVAR_TEST_PACKAGE: com.yazsras.astravar
          ASTRAVAR_TEST_APK: app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION_CODE: '59'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path("scripts/ci-emulator.sh").read_text()
          mark = 'if [ -n "$' + '{ASTRAVAR_BASELINE_APK:-}" ]; then'
          assert src.count(mark) == 1
          (Path(os.environ["RUNNER_TEMP"])/"pin-device.sh").write_text(src.split(mark)[0])
          PY
          cat >> "$RUNNER_TEMP/pin-device.sh" <<'SH'
          test "$(adb -s "$astravar_serial" shell getprop ro.build.version.sdk | tr -d '\r')" = 36
          run_stage GenesisUpgradeInstrumentationTest#seedAscensionCode58 1 480 pin-source58.txt 58
          stop_product
          adb -s "$astravar_serial" install -r "$astravar_apk"
          run_stage PlayerFirstJourneyInstrumentationTest#prepareFocusedSkillActor 1 520 pin-actor59.txt
          pin_status=0
          run_stage GenesisConsolidationInstrumentationTest#retainedSkillJourneyOnly 1 650 pin-skill59.txt || pin_status=$?
          stop_product
          timeout 15s adb -s "$astravar_serial" root || true
          timeout 25s adb -s "$astravar_serial" wait-for-device
          test "$(adb -s "$astravar_serial" shell id -u | tr -d '\r')" = 0
          copy_campaign_database "$RUNNER_TEMP/pin-room"
          if (( pin_status == 0 )); then
            python3 scripts/qa-consolidation-skill-readback.py --synthetic-emulator "$RUNNER_TEMP/pin-room/astravar-campaign-ledger.db" | tee validation/pin-proof/room.json
          else
            python3 - "$RUNNER_TEMP/pin-room/astravar-campaign-ledger.db" <<'PY'
          from pathlib import Path
          import json,sqlite3,sys
          with sqlite3.connect(Path(sys.argv[1]).resolve().as_uri()+"?mode=ro",uri=True) as db:
              for (row,) in db.execute("SELECT characterJson FROM reforge_characters"):
                  actor=json.loads(row)
                  if actor["name"]=="CI Native Hero Revised":
                      print("Observed skills on failure",[(s["id"],s["name"]) for s in actor.get("customSkills",[])],"saved pins",actor.get("pinnedSkillIds",[]))
          PY
          fi
          exit "$pin_status"
          SH
          bash "$RUNNER_TEMP/pin-device.sh"
      - name: Show the recorded screen and targeted states
        if: always()
        run: |
          test ! -f validation/native-stages.tsv || cat validation/native-stages.tsv
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for p in Path("validation/emulator-evidence").glob("failure-*.xml"):
              print(p.name)
              print([n.get("text") or n.get("content-desc") for n in ET.parse(p).getroot().iter("node") if n.get("package")=="com.yazsras.astravar" and (n.get("text") or n.get("content-desc"))])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-skill-pin-evidence
          path: |
            validation/pin-proof/
            validation/native-stages.tsv
            validation/pin-*.txt
            validation/emulator-evidence/consolidation-retained-custom-skill-roll.*
            validation/emulator-evidence/failure-*.*
          if-no-files-found: warn
          retention-days: 5
