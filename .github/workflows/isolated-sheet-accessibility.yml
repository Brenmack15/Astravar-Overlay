name: Isolated connected sheet and skill accessibility
on:
  push:
    branches: ['verification/ascension-sheet-layout-check-20261127']
permissions:
  contents: read
jobs:
  sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4aa4cb04e283dd62291a6c685bb7f66f0b724f40
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - uses: ./.github/actions/robolectric-runtime
      - run: bash scripts/ci-android-sdk.sh
      - name: Exercise actual connected normal controls and print precise native assertion failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation/sheet-tests
          outcome=0
          bash gradlew --console=plain --build-cache :app:testDebugUnitTest --rerun --tests '*CloudSheetAccessibilityInteropTest' --tests '*CloudCharacterLayoutInteropTest' --tests '*CloudCharacterContinuityInteropTest' --tests '*CloudCheckInspectorsTest' --tests '*CloudCastingDiceInteropTest' || outcome=$?
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml validation/sheet-tests/ || true
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          n=0
          for p in sorted(Path('validation/sheet-tests').glob("TEST-*.xml")):
              root=ET.parse(p).getroot()
              if not int(root.get("tests",0)): continue
              print(root.get('name'), root.get('tests'), root.get('failures'), root.get('errors'))
              for t in root.findall("testcase"):
                  n+=1
                  bad=t.find("failure")
                  if bad is not None:
                      print(t.get("name"),bad.get('message','')[:1000])
                      for l in (bad.text or "").splitlines():
                          if 'CloudSheetAccessibilityInteropTest' in l or 'Text =' in l or 'Expected' in l or 'Size' in l or 'bound' in l:
                              print(l[:400])
          print("Native cases examined:", n)
          PY
          exit "$outcome"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: connected-sheet-skill-evidence
          path: validation/sheet-tests/
          if-no-files-found: ignore
