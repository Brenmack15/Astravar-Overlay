name: Isolated Chronicle evidence
on:
  push:
    branches: [verification/ascension-chronicle-harness-20261127]
permissions:
  actions: read
  contents: read
  statuses: write
jobs:
  archived:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Link this isolated evidence run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=isolated-chronicle-archive \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Reading the synthetic verification archive' --silent
      - name: Inspect the registered synthetic failure and historical release skips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in 45923727140:15166581220 45917871906:15165745913; do
            run_id=${pair%:*}
            artifact=${pair#*:}
            base="/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
            test "$(gh api "$base" --jq '.workflow_run.id')" = "$run_id"
            gh api "$base/zip" > "$RUNNER_TEMP/$artifact.zip"
          done
          python3 - <<'PY'
          from os import environ
          from pathlib import Path
          import zipfile
          from xml.etree import ElementTree as ET
          runner = Path(environ["RUNNER_TEMP"])
          suite = "com.yazsras.astravar.ui.CloudWorldChronicleInteropTest"
          with zipfile.ZipFile(runner / "15166581220.zip") as z:
              p = next(k for k in z.namelist() if k.endswith("/test-results/testDebugUnitTest/TEST-"+suite+".xml"))
              test = ET.fromstring(z.read(p)).find("testcase")
              err = test.find("failure")
              assert err is not None and test.get("name") == "nativeWorldAndChronicleRetainKnownRelationshipsSourceCorrectionsAndProjectMilestones"
              print("Archived Chronicle assertion and observed semantics")
              detail = (err.text or "").splitlines()
              for line in detail:
                  if suite in line or "Missing " in line:
                      print(line[:600])
              selected = [l.strip() for l in detail if any(k in l for k in ("Text =", "Text = [", "ContentDescription =", "TestTag =", "Disabled", "EditableText", "Role =", "Node #"))]
              for line in selected[:220]:
                  print(line[:420])
          with zipfile.ZipFile(runner / "15165745913.zip") as z:
              for p in sorted(z.namelist()):
                  if "/test-results/testReleaseUnitTest/TEST-" not in p or not p.endswith(".xml"): continue
                  xml = ET.fromstring(z.read(p))
                  for t in xml.findall("testcase"):
                      if t.find("skipped") is not None:
                          print("Release skip", t.get("classname"), t.get("name"))
          PY
      - name: Measure retained isolated Android 17 status icon samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="/repos/$GITHUB_REPOSITORY/actions/artifacts/15166880758"
          test "$(gh api "$base" --jq '.workflow_run.id')" = "45923727140"
          gh api "$base/zip" > "$RUNNER_TEMP/notification.zip"
          python3 -m venv "$RUNNER_TEMP/icon-reader"
          "$RUNNER_TEMP/icon-reader/bin/pip" -q install pillow==11.3.0 numpy==2.2.6
          "$RUNNER_TEMP/icon-reader/bin/python" - <<'PY'
          from base64 import b64encode
          from collections import deque
          from io import BytesIO
          from os import environ
          from pathlib import Path
          import re
          import zipfile
          import numpy as np
          from PIL import Image, ImageDraw

          def groups(numbers, tolerated_gap=0):
              values = sorted(set(numbers))
              if not values: return []
              runs = []; start = previous = values[0]
              for n in values[1:]:
                  if n - previous > tolerated_gap + 1:
                      runs.append((start, previous)); start = n
                  previous = n
              runs.append((start, previous)); return runs

          with zipfile.ZipFile(Path(environ["RUNNER_TEMP"])/"notification.zip") as z:
              files=[p for p in z.namelist() if p.endswith("notification-emblem.txt")]
              for p in files:
                  print("Notification test output",p)
                  for line in z.read(p).decode(errors="replace").splitlines():
                      if "Assertion" in line or "FAILURES" in line or "nativeTest.kt:" in line:
                          print(line[:380])
              members=[p for p in z.namelist() if re.search(r"/api37-(light|dark)-(status|shade)(-icon)?\.png$",p)]
              print("PNG members",members)
              full=next(p for p in members if p.endswith("api37-light-status.png"))
              icon=next((p for p in members if p.endswith("api37-light-status-icon.png")),None)
              img=Image.open(BytesIO(z.read(full))).convert("RGB")
              crop=Image.open(BytesIO(z.read(icon))).convert("RGB") if icon else None
          w,h=img.size
          height=min(160,max(64,h//12))
          top=np.asarray(img.crop((0,0,w,height))).astype('int32')
          lum=(top[...,0]*54+top[...,1]*183+top[...,2]*19)//256
          bg=int(np.median(lum[:,w//2:2*w//3]))
          dark=(bg-lum) > 36 if bg>=128 else (lum-bg)>36
          print("Frame dimensions RGB",img.size,"upper scan height",height,"center background luminance",bg, "crop size",crop.size if crop else None)
          ys,xs=np.where(dark)
          print("Distinct foreground y bands",groups(ys.tolist()),"grouped x bands",groups(xs.tolist(),3)[:75])
          components=[];marked=set()
          for seed in zip(ys.tolist(),xs.tolist()):
              if seed in marked:continue
              marked.add(seed);todo=deque([seed]);points=[]
              while todo:
                  yy,xx=todo.pop();points.append((yy,xx))
                  for y1 in range(max(0,yy-1),min(height,yy+2)):
                      for x1 in range(max(0,xx-1),min(w,xx+2)):
                          if dark[y1,x1] and (y1,x1) not in marked:
                              marked.add((y1,x1));todo.append((y1,x1))
              if len(points)>=4: components.append((min(p[1] for p in points),min(p[0] for p in points),max(p[1] for p in points)+1,max(p[0] for p in points)+1,len(points)))
          print("Observed connected contrasting components (l,t,r,b,area)",sorted(components)[:90])
          if crop:
              pix=np.asarray(crop).astype("int32");ch,cw=pix.shape[:2]
              ink=np.max(np.abs(pix-bg),axis=2)
              ky,kx=np.unravel_index(ink.argmax(),ink.shape)
              matches=[]
              for y,x in np.argwhere(np.all(top==pix[ky,kx],axis=2)):
                  top_y,left_x=int(y-ky),int(x-kx)
                  if 0<=top_y<=height-ch and 0<=left_x<=w-cw and np.array_equal(top[top_y:top_y+ch,left_x:left_x+cw],pix):
                      matches.append((left_x,top_y,cw,ch))
                      if len(matches)==5:break
              print("Android matcher saved-crop coordinates in same frame",matches)
          for tag,small in (("bar",img.crop((0,0,w,height)).resize((min(650,w),max(1,round(height*min(650,w)/w))))),("crop",crop)):
              if small is None:continue
              buf=BytesIO();small.save(buf,format="PNG")
              print("SYNTHETIC_ICON_"+tag.upper()+"_BASE64="+b64encode(buf.getvalue()).decode())

          rings=[[(12,1),(20,8),(17,17),(12,23),(7,17),(4,8)],[(12,4),(7,8.3),(10.5,9)],[(7,10),(9.2,16),(11,18.4),(10.4,11)],[(13.6,10.8),(13,18.4),(15,16),(17,10)],[(12.8,4.5),(13.6,9),(17,8.3)]]
          ref=Image.new("L",(384,384),0);draw=ImageDraw.Draw(ref)
          for i,ring in enumerate(rings):
              draw.polygon([(round(x*16),round(y*16)) for x,y in ring], fill=255 if i==0 else 0)
          alpha=np.asarray(ref.resize((24,24),Image.Resampling.LANCZOS))
          samples=[(x,y,int(alpha[y,x]>=220)) for y in range(2,23,2) for x in range(3,22,2) if alpha[y,x]>=220 or alpha[y,x]<=12]
          n=len(samples);white=sum(q[2] for q in samples);black=n-white
          print("24px reference sample counts",n,white,black)
          bounds=min(w*3//4,w);L=lum[:height,:bounds].astype('float64')
          locations=np.arange(bounds)[None,:]
          winners=[None,None];best=[0.,0.]
          for side in range(8,min(110,height,bounds)+1):
              rows=(height-side)//2+1;cols=(bounds-side)//2+1
              total=np.zeros((rows,cols));ink=np.zeros_like(total);squares=np.zeros_like(total)
              for x,y,is_white in samples:
                  dy=int((y+0.5)*side/24);dx=int((x+0.5)*side/24)
                  p=L[dy:dy+rows*2:2,dx:dx+cols*2:2]
                  total+=p;squares+=p*p
                  if is_white:ink+=p
              var=squares*n-total*total
              allowed=(var>0)&(np.abs(ink/white-(total-ink)/black)>=25)
              score=np.zeros_like(total)
              np.divide(np.abs(ink*n-total*white),np.sqrt(np.maximum(0,var)*white*black),out=score,where=allowed)
              for ix in (0,1):
                  masked=score if ix==0 else np.where((locations[:,:cols]*2 > w*0.22)&(locations[:,:cols]*2 < w*0.70),score,0.)
                  if masked.max()>best[ix]:
                      yy,xx=np.unravel_index(masked.argmax(),masked.shape)
                      best[ix]=float(masked[yy,xx]); winners[ix]=(int(2*xx),int(2*yy),side)
          print("Diagnostic best masked luminance x/y/side over top 75 percent then post-clock center (not Android gate)",list(zip(winners,best)))
          PY
      - name: Record the archive inspection result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATE: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATE" = success ]; then state=success; fi
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context=isolated-chronicle-archive \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Synthetic archive inspection complete' --silent
  focused:
    if: contains(github.event.head_commit.message, '[test chronicle]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - uses: ./.github/actions/robolectric-runtime
      - run: bash scripts/ci-android-sdk.sh
      - name: Repeat ordinary connected workflows and verify individual outcomes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chronicle-screens"
          for iteration in 1 2 3; do
            bash gradlew --console=plain --build-cache :app:testDebugUnitTest --rerun \
              --tests '*CloudWorldChronicleInteropTest' --tests '*CloudRecordScreensTest' \
              --tests '*CloudChronologyPanelTest' --tests '*CloudInventionGenealogyInteropTest' \
              --tests '*CloudOwnerRecoveryInteropTest' -PastravarScreenshots="$RUNNER_TEMP/chronicle-screens"
            python3 - "$iteration" <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import sys
          for x in sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml")):
              root = ET.parse(x).getroot()
              assert all(int(root.get(k,0)) == 0 for k in ("failures","errors","skipped"))
              print("Iteration", sys.argv[1], root.get("name"), root.get("tests"), root.get("time"))
          PY
          done
      - name: Retain failing or successful JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-chronicle-junit
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
