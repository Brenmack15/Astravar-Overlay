name: Check release input verification harness
on:
  push:
    branches: [verification/ascension-release-inputs-20261127]
    paths: [scripts/qa-release-inputs.py, .github/workflows/check-release-input-harness.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check the private signer's portable input boundaries with local disposable bytes
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/qa-release-inputs.py
          python3 scripts/qa-release-inputs.py --help
          python3 -m unittest discover -s scripts/tests -p 'test_owner_release_sign.py'
          python3 - <<'PY'
          import hashlib, json, runpy, tempfile, types, zipfile
          from pathlib import Path
          verify = runpy.run_path("scripts/qa-release-inputs.py")
          policy = types.SimpleNamespace(**runpy.run_path("scripts/owner_release_sign.py"))
          with tempfile.TemporaryDirectory() as directory:
              apk = Path(directory)/"synthetic.zip"
              content = [("classes.dex", b"synthetic bytes"), ("META-INF/example", b"source")]
              with zipfile.ZipFile(apk, "w") as archive:
                  for name, value in content:
                      archive.writestr(name, value)
              digest = hashlib.sha256()
              for name, value in sorted(content):
                  row = [name,len(value),hashlib.sha256(value).hexdigest()]
                  digest.update((json.dumps(row,separators=(",",":"))+"\n").encode("ascii"))
              assert verify["payload_digest"](apk, policy) == {"entries": 2, "sortedNameSizeContentManifestSha256": digest.hexdigest()}
          print("Disposable two-entry transport check passed")
          PY
  receipt:
    name: Read the measured QA payload manifest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - name: Read the preserved receipt by its official repository digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          umask 077
          artifact=15184464592
          expected=c5dbfda6fef54062e77bdfa2df043a9a6bbbaf17d834b49b3d8a4e7e5a8ad2ff
          api="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact"
          gh api "$api" > receipt-metadata.json
          jq -e --arg hash "sha256:$expected" '.name == "ascension-native-input-receipts" and .digest == $hash and .workflow_run.id == 45972156517 and .expired == false' receipt-metadata.json >/dev/null
          gh api "$api/zip" > receipt.zip
          echo "$expected  receipt.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,zipfile
          with zipfile.ZipFile("receipt.zip") as z:
              assert sorted(z.namelist()) == ["ci-evidence.json","preservation.json","tested-input.json"]
              c,p,t = [json.loads(z.read(n)) for n in ("ci-evidence.json","preservation.json","tested-input.json")]
              assert p["members"]["tested-input.json"] == hashlib.sha256(z.read("tested-input.json")).hexdigest()
              assert p["members"]["ci-evidence.json"] == hashlib.sha256(z.read("ci-evidence.json")).hexdigest()
              assert c["run"]["run_id"]==p["officialRun"]==45962475021 and c["artifact"]["artifact_id"]==p["officialArtifactId"]==15185466555
              assert p["sourceCommit"] == t["sourceCommit"] == "9ded49ee06b22f389c4d5f5553f975cb02fa762f"
              assert t["archiveSha256"] == p["officialArchiveSha256"] == "f34d8562f6c13fe775bd4ae79ed79f8d837227cfa07091c39332ab622accf309"
              assert t["testedApkSha256"] == p["testedApkSha256"] == "a45cb267e6a5e906aad7653f2120c29a2970dd6701d6086c93de7f7969afaef7"
              assert p["wrapperId"]==15185767457 and p["retrievedAndVerified"] and p["requestedRetentionDays"]==90
              assert t["ownerSigningPerformed"] is False and t["ownerSigningMaterialAccessed"] is False
              print("QA_PAYLOAD_MEASUREMENT "+json.dumps({k:t[k] for k in ("package","versionName","versionCode","apkPayload","nativeChecks","sdk","sixteenKiBAligned")},sort_keys=True))
          PY
