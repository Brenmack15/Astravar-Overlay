name: Isolated Android 17 accessible roll and external paste
on:
  push:
    branches: ['verification/ascension-sheet-api37-check-20261127']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e7dc27212babbd4376a6e971f27a4731a1554820
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Build the test and the separate target application
        run: |
          bash scripts/ci-android-sdk.sh
          bash gradlew --console=plain --build-cache :app:assembleDebug :app:assembleDebugAndroidTest :overlay-target:assembleDebug
      - name: Boot an owned Android 17 emulator and paste in a separate package
        shell: bash
        run: |
          set -euo pipefail
          sdkbin=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$sdkbin"
          export PATH="$(dirname "$sdkbin"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sudo chmod a+rw /dev/kvm
          bash scripts/ci-android17-sdk.sh
          qa_sdk="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sheet-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd=AstravarSheetQA
          serial=emulator-5578
          device() { adb -s "$serial" "$@"; }
          printf 'no\n' | avdmanager create avd -f -n "$avd" -k 'system-images;android-37.0;default;x86_64' --device pixel_6
          "$qa_sdk/emulator/emulator" -avd "$avd" -port 5578 -accel on -no-window -no-audio -no-snapshot -no-boot-anim -memory 4096 -gpu swiftshader > "$RUNNER_TEMP/sheet-emulator.log" 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          timeout 140 adb -s "$serial" wait-for-device
          for i in $(seq 1 100); do
            kill -0 "$qemu_pid"
            if test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          test "$(device shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$(device shell getprop ro.build.version.sdk | tr -d '\r')" = 37
          test "$(device emu avd name | tr -d '\r' | head -1)" = "$avd"
          product=com.yazsras.astravar.v2uidebug
          test -z "$(device shell pm path "$product" | tr -d '\r')"
          device install app/build/outputs/apk/debug/app-debug.apk
          device install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          device install overlay-target/build/outputs/apk/debug/overlay-target-debug.apk
          device shell input keyevent KEYCODE_WAKEUP
          device shell wm dismiss-keyguard
          mkdir -p validation/sheet
          timeout -k 5s 240s adb -s "$serial" shell am instrument -w -r -e class com.yazsras.astravar.ui.AscensionAccessibleRollClipboardTest "$product.test/androidx.test.runner.AndroidJUnitRunner" | tee validation/sheet/paste-native.txt
          grep -q '^OK (1 test)' validation/sheet/paste-native.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android17-accessible-roll-paste
          path: validation/sheet/
          if-no-files-found: ignore
