name: Astravar tiered verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      tier:
        description: 'Full includes all release regression and historical native upgrade gates'
        type: choice
        options: [full, fast]
        default: full
permissions:
  contents: read
  actions: read
concurrency:
  group: astravar-development-${{ github.event.pull_request.number || github.ref }}-${{ inputs.tier || 'automatic' }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_required: ${{ steps.plan.outputs.full_required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Select tests and release risk
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUIRE_FULL: ${{ inputs.tier == 'full' || contains(github.event.pull_request.labels.*.name, 'full-verification') }}
        run: |
          base=HEAD^
          if [[ -n "$BASE_SHA" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi
          args=()
          if [[ "$REQUIRE_FULL" == true ]]; then args+=(--full); fi
          python3 scripts/ci-select-tests.py --base "$base" "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Astravar-verification-plan
          path: validation/ci-plan.json
  purchase-baseline:
    name: Reproduce purchase rollback on installed code 57
    if: github.base_ref == 'convergence/reviewed-native-sync-code57'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Transfer only the isolated reproducer into the frozen source
        run: |
          test_path=app/src/test/java/com/yazsras/astravar/data/CampaignConnectionTest.kt
          mkdir -p "$RUNNER_TEMP/purchase-fixture"
          cp "$test_path" backend/owner-bridge/fixtures/campaign-purchase-proposal.json "$RUNNER_TEMP/purchase-fixture/"
          git fetch --depth=1 origin 689dadcc050d26f686b93ca4357c8c5e907c58e2
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/purchase-fixture/CampaignConnectionTest.kt" "$test_path"
          mkdir -p app/src/test/resources
          cp "$RUNNER_TEMP/purchase-fixture/campaign-purchase-proposal.json" app/src/test/resources/
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: ./.github/actions/robolectric-runtime
      - run: bash scripts/ci-android-sdk.sh
      - run: bash gradlew --console=plain :app:testDebugUnitTest --tests '*CampaignConnectionTest.bridgePurchase*'
  fast:
    name: Fast development gate
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Recreate exact test plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=HEAD^
          if [[ -n "$BASE_SHA" ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi
          python3 scripts/ci-select-tests.py --base "$base"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate cloud requirements and real D1 runtime
        run: |
          mkdir -p validation
          set -o pipefail
          node scripts/verify-ascension-parity.mjs validation/ascension-protocol-parity.json
          cmp docs/ascension/protocol-parity.json validation/ascension-protocol-parity.json
          python3 tools/ascension_trace_check.py | tee validation/ascension-trace.txt
          bash scripts/ci-ascension-provider.sh | tee validation/ascension-provider.log
      - name: Critical protocol and source safety before Android compilation
        run: |
          node --test backend/owner-bridge/*.test.mjs
          bash scripts/ci-python-tests.sh
          python3 scripts/verify_v2_protected_source.py
          python3 scripts/verify_ui_foundation.py
          python3 scripts/verify_upgrade_integrity.py
          python3 scripts/verify_branding.py
          python3 scripts/verify_particle_resources.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.ref_name != github.event.repository.default_branch && github.event_name != 'workflow_dispatch' }}
      - uses: ./.github/actions/robolectric-runtime
      - name: Use installed Android packages
        timeout-minutes: 9
        run: bash scripts/ci-android-sdk.sh
      - name: Rules and selected Android regressions
        timeout-minutes: 20
        run: python3 scripts/ci-fast-tests.py
      - name: Debug lint and development APK
        timeout-minutes: 10
        run: bash gradlew --console=plain --build-cache --profile :app:lintDebug :app:assembleDebug
      - name: Record source and failures
        if: always()
        run: |
          mkdir -p validation
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
          python3 scripts/ci-test-summary.py
          if [[ -f app/build/outputs/apk/debug/app-debug.apk ]]; then sha256sum app/build/outputs/apk/debug/app-debug.apk > validation/SHA256SUMS.txt; fi
          printf '%s\n' 'Development QA APK only; separate package and disposable signer. Not an owner update or stable-release approval.' > validation/QA-ONLY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-development-verification
          path: |
            validation/
            app/build/outputs/apk/debug/*.apk
            app/build/test-results/
            build/reports/profile/
            app/build/reports/
            rules/build/test-results/
          retention-days: 14
  full:
    name: Full regression gate
    needs: [plan, fast]
    if: needs.plan.outputs.full_required == 'true'
    uses: ./.github/workflows/astravar-3.0.yml
  native:
    name: Historical upgrade and native acceptance
    needs: [plan, fast]
    if: needs.plan.outputs.full_required == 'true'
    uses: ./.github/workflows/android.yml
  required:
    name: Astravar required verification
    needs: [plan, fast, full, native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on missing or unsuccessful required tiers
        env:
          PLAN: ${{ needs.plan.result }}
          FAST: ${{ needs.fast.result }}
          FULL_REQUIRED: ${{ needs.plan.outputs.full_required }}
          FULL: ${{ needs.full.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$PLAN" = success
          test "$FAST" = success
          if [[ "$FULL_REQUIRED" == true ]]; then
            test "$FULL" = success
            test "$NATIVE" = success
          fi
