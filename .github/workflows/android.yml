name: Bounded Android verification
on:
  push:
    branches: ['feat/astravar-android', 'feat/astravar-android/**', 'feat/astravar-inventory-mvp-v170', 'feat/astravar-2.0-integrated', 'feat/astravar-2.0-ui-rebuild']
  pull_request:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Reuse product APK from this verified workflow run; 0 builds everything'
        required: false
        default: '0'
        type: string
      remote_stat_live:
        description: 'Append disposable remote-stat commands and acknowledgements to the existing public sandbox'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REUSE_RUN_ID: ${{ inputs.reuse_run_id || '0' }}
      INVENTORY_BETA: ${{ github.head_ref == 'feat/astravar-inventory-mvp-v170' || github.ref_name == 'feat/astravar-inventory-mvp-v170' || github.head_ref == 'feat/astravar-2.0-integrated' || github.ref_name == 'feat/astravar-2.0-integrated' || github.head_ref == 'feat/astravar-2.0-ui-rebuild' || github.ref_name == 'feat/astravar-2.0-ui-rebuild' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select explicit overlay-only recheck
        env:
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$PUSH_MESSAGE" =~ ^Reuse\ product\ run\ ([0-9]+)\ for\ overlay\ tests ]]; then
            echo "REUSE_RUN_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        timeout-minutes: 7
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          timeout -k 5s 120s curl --connect-timeout 15 --max-time 110 -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf 'y\n%.0s' {1..100} | timeout -k 5s 60s sdkmanager --licenses >/dev/null
          if [[ "$INVENTORY_BETA" == 'true' ]]; then
            timeout -k 10s 240s sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          else
            timeout -k 10s 240s sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'system-images;android-36;google_apis;x86_64'
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/19.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Unit tests, lint and native APKs
        if: env.REUSE_RUN_ID == '0'
        timeout-minutes: 20
        env:
          # Explicit marker also allows this opted-in test while the default branch
          # deliberately has no Android workflow. Ordinary pushes/PRs do not write.
          ASTRAVAR_LIVE_REMOTE_STATS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.remote_stat_live) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Verify disposable remote-stat HTTPS'))) && 'true' || 'false' }}
        run: |
          chmod +x gradlew
          if [[ "$INVENTORY_BETA" == 'true' ]]; then
            python3 -m unittest discover -s scripts/tests -v
            python3 scripts/verify_v2_protected_source.py
            stat_args=()
            if [[ "${{ github.head_ref || github.ref_name }}" == 'feat/astravar-2.0-ui-rebuild' ]]; then
              python3 scripts/verify_ui_foundation.py
              stat_args+=('-PastravarRemoteStatTest=true')
            fi
            timeout -k 10s 1140s ./gradlew --no-daemon --console=plain :rules:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug "${stat_args[@]}" -PastravarScreenshots="$GITHUB_WORKSPACE/validation/screenshots"
            exit 0
          fi
          # This one-run key is ONLY for exercising the optimized release on CI.
          # The delivered candidate is signed privately with the existing owner key.
          export ASTRAVAR_KEYSTORE="$RUNNER_TEMP/ci-test-only.p12"
          export ASTRAVAR_STORE_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_ALIAS=astravar-ci
          timeout 15s keytool -genkeypair -noprompt -keystore "$ASTRAVAR_KEYSTORE" -storetype PKCS12 -storepass "$ASTRAVAR_STORE_PASSWORD" -keypass "$ASTRAVAR_KEY_PASSWORD" -alias "$ASTRAVAR_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Astravar CI test only'
          trap 'rm -f "$ASTRAVAR_KEYSTORE"' EXIT
          timeout -k 10s 540s ./gradlew --no-daemon --console=plain :rules:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
      - name: Reuse verified product and build current overlay tests
        if: env.REUSE_RUN_ID != '0'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha=$(timeout 15s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .head_sha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          timeout -k 5s 30s git fetch --depth=1 origin "$source_sha"
          # Reuse is permitted only when every product/build input is unchanged.
          git diff --exit-code "$source_sha" HEAD -- app rules build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat
          timeout -k 5s 60s gh run download "$REUSE_RUN_ID" --name android-verification --dir reused-product
          mkdir -p app/build/outputs/apk/release validation
          cp reused-product/app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/
          printf 'Product APK reused without modification from run %s\n' "$REUSE_RUN_ID" > validation/product-provenance.txt
          sha256sum app/build/outputs/apk/release/app-release.apk >> validation/product-provenance.txt
          chmod +x gradlew
          timeout -k 10s 210s ./gradlew --no-daemon --console=plain :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
      - name: Real overlay interaction on Android 16
        if: env.INVENTORY_BETA != 'true'
        timeout-minutes: 9
        env:
          ASTRAVAR_TEST_APK: app/build/outputs/apk/release/app-release.apk
          ASTRAVAR_TEST_PACKAGE: com.yazsras.astravar
        run: timeout -k 10s 500s bash scripts/ci-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            overlay-target/build/outputs/apk/**/*.apk
            app/build/reports/
            rules/build/reports/
            app/build/test-results/
            rules/build/test-results/
            validation/
          retention-days: 14

      - name: Verify and name Astravar 2.0 Stat Test APK
        if: success() && (github.head_ref == 'feat/astravar-2.0-ui-rebuild' || github.ref_name == 'feat/astravar-2.0-ui-rebuild')
        run: |
          mkdir -p validation
          cp app/build/outputs/apk/debug/app-debug.apk validation/Astravar-2.0-Stat-Test-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs validation/Astravar-2.0-Stat-Test-debug.apk > validation/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 validation/Astravar-2.0-Stat-Test-debug.apk > validation/apk-alignment.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging validation/Astravar-2.0-Stat-Test-debug.apk > validation/apk-badging.txt
          sha256sum validation/Astravar-2.0-Stat-Test-debug.apk > validation/SHA256SUMS.txt
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && (github.head_ref == 'feat/astravar-2.0-ui-rebuild' || github.ref_name == 'feat/astravar-2.0-ui-rebuild')
        with:
          name: Astravar-2.0-Stat-Test-apk
          path: |
            validation/Astravar-2.0-Stat-Test-debug.apk
            validation/SHA256SUMS.txt
            validation/SOURCE_COMMIT.txt
            validation/apk-*.txt
          retention-days: 14
