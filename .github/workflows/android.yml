name: Bounded Android verification
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Reuse product APK from this verified workflow run; 0 builds everything'
        required: false
        default: '0'
        type: string
      remote_stat_live:
        description: 'Append disposable remote-stat commands and acknowledgements to the existing public sandbox'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true
jobs:
  verify:
    # This checked-out source is Genesis regardless of the caller's branch name.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REUSE_RUN_ID: ${{ inputs.reuse_run_id || '0' }}
      ASTRAVAR_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      # The Reforge workflow is the exact-head full rules/debug/release/lint gate.
      # Run native acceptance concurrently instead of duplicating that 30-minute
      # regression batch before the first touch on every 3.1 candidate.
      REFORGE_FULL_GATE: 'true'
      GENESIS_GATE: 'true'
      EXPECTED_VERSION_NAME: '4.0.0-convergence1'
      EXPECTED_VERSION_CODE: '54'
      INVENTORY_BETA: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Verify the exact published head, including on pull_request events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require a fresh Genesis baseline and candidate pair
        if: env.GENESIS_GATE == 'true'
        run: |
          # Both versions must use this run's disposable test certificate.
          test "$REUSE_RUN_ID" = 0 || { echo "Genesis verification requires a fresh build; reused APKs cannot share this run's baseline signer."; exit 1; }
      - name: Select explicit overlay-only recheck
        if: env.GENESIS_GATE != 'true'
        env:
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # PR events do not include head_commit. Read only the checked-out
          # exact head's subject; the reuse step still verifies every app input.
          astravar_recheck_subject=${PUSH_MESSAGE:-$(git log -1 --format=%s)}
          if [[ "$astravar_recheck_subject" =~ ^Reuse\ product\ run\ ([0-9]+)\ for\ overlay\ tests ]]; then
            echo "REUSE_RUN_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.ref_name != github.event.repository.default_branch && github.event_name != 'workflow_dispatch' }}
      - name: Use installed Android packages
        timeout-minutes: 9
        run: |
          if [[ "$INVENTORY_BETA" == true ]]; then
            bash scripts/ci-android-sdk.sh
          else
            bash scripts/ci-android-sdk.sh native
          fi
      - name: Prepare stable Android 17 authorization and import fixture
        if: env.GENESIS_GATE == 'true'
        timeout-minutes: 10
        run: bash scripts/ci-android17-sdk.sh
      - name: Restore immutable historical APK build cache
        if: env.GENESIS_GATE == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/astravar-baseline-cache
          key: astravar-historical-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-baseline.py', 'scripts/inspect_release_apk.py') }}
      - name: Build native APKs; full regressions stay in the exact-head Reforge gate
        id: native_build
        if: env.REUSE_RUN_ID == '0'
        timeout-minutes: 60
        env:
          # Explicit marker also allows this opted-in test while the default branch
          # deliberately has no Android workflow. Ordinary pushes/PRs do not write.
          ASTRAVAR_LIVE_REMOTE_STATS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.remote_stat_live) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Verify disposable remote-stat HTTPS'))) && 'true' || 'false' }}
        run: |
          chmod +x gradlew
          # Release-candidate checks. Existing debug-branch checks remain unchanged.
          if [[ "$INVENTORY_BETA" != 'true' && "$REFORGE_FULL_GATE" != 'true' ]]; then
            python3 -m unittest discover -s scripts/tests -v
            python3 scripts/verify_v2_protected_source.py
            python3 scripts/verify_ui_foundation.py
            python3 scripts/verify_branding.py
            python3 scripts/verify_particle_resources.py
          fi
          if [[ "$INVENTORY_BETA" == 'true' ]]; then
            python3 -m unittest discover -s scripts/tests -v
            python3 scripts/verify_v2_protected_source.py
            stat_args=()
            if [[ "$ASTRAVAR_SOURCE_BRANCH" == 'feat/astravar-2.0-ui-rebuild' ]]; then
              python3 scripts/verify_ui_foundation.py
              python3 scripts/verify_branding.py
              export ASTRAVAR_VERSION_CODE=23
              stat_args+=('-PastravarRemoteStatTest=true')
            fi
            timeout -k 10s 1140s ./gradlew --console=plain --build-cache --profile :rules:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug "${stat_args[@]}" -PastravarScreenshots="$GITHUB_WORKSPACE/validation/screenshots"
            exit 0
          fi
          # This one-run key is ONLY for exercising the optimized release on CI.
          # The delivered candidate is signed privately with the existing owner key.
          export ASTRAVAR_KEYSTORE="$RUNNER_TEMP/ci-test-only.p12"
          export ASTRAVAR_STORE_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_ALIAS=astravar-ci
          timeout 15s keytool -genkeypair -noprompt -keystore "$ASTRAVAR_KEYSTORE" -storetype PKCS12 -storepass "$ASTRAVAR_STORE_PASSWORD" -keypass "$ASTRAVAR_KEY_PASSWORD" -alias "$ASTRAVAR_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Astravar CI test only'
          trap 'rm -f "$ASTRAVAR_KEYSTORE"' EXIT
          regression_tasks=(:rules:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease)
          if [[ "$REFORGE_FULL_GATE" == 'true' ]]; then
            regression_tasks=()
            printf '%s\n' 'Full rules, debug/release unit tests and both lint variants remain required in Astravar Reforge verification for this exact source commit.'
          fi
          timeout -k 10s 2640s ./gradlew --console=plain --build-cache --profile "${regression_tasks[@]}" :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
          mkdir -p validation
          python3 scripts/inspect_release_apk.py app/build/outputs/apk/release/app-release.apk --sdk "$ANDROID_HOME" --package com.yazsras.astravar --version-name "$EXPECTED_VERSION_NAME" --version-code "$EXPECTED_VERSION_CODE" --output validation/ci-release-package.json
          printf '%s\n' 'Optimized release variant, disposable CI signer only. Not compatible with the original owner installation.' > validation/CI-RELEASE-ONLY.txt
          if [[ "$GENESIS_GATE" == 'true' ]]; then
            # Exact fixed historical sources, checksum-bound cache, and same-run
            # disposable re-signing. A corrupt cache fails closed; no owner key.
            python3 scripts/ci-baseline.py --version-code 49 --cache-dir "$RUNNER_TEMP/astravar-baseline-cache" --output-dir validation/upgrade-baseline --candidate app/build/outputs/apk/release/app-release.apk
            python3 scripts/ci-baseline.py --version-code 50 --cache-dir "$RUNNER_TEMP/astravar-baseline-cache" --output-dir validation/upgrade-baseline --candidate app/build/outputs/apk/release/app-release.apk
            echo 'ASTRAVAR_BASELINE_APK=validation/upgrade-baseline/code49-ci.apk' >> "$GITHUB_ENV"
            echo 'ASTRAVAR_GENESIS_BASELINE_APK=validation/upgrade-baseline/code50-ci.apk' >> "$GITHUB_ENV"
            bash scripts/ci-bootstrap-baseline.sh
          fi
      - name: Save validated historical cache in its trusted branch or PR scope
        # Cache validated immutable build inputs before unrelated native journeys.
        # This is never evidence that an upgrade or release gate passed.
        if: success() && steps.native_build.outcome == 'success' && env.GENESIS_GATE == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/astravar-baseline-cache
          key: astravar-historical-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci-baseline.py', 'scripts/inspect_release_apk.py') }}
      - name: Reuse verified product and build current overlay tests
        if: env.REUSE_RUN_ID != '0'
        timeout-minutes: 9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
          source_sha=$(timeout 15s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID" --jq .head_sha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          timeout -k 5s 30s git fetch --depth=1 origin "$source_sha"
          # Reuse is permitted only when every product/build input is unchanged.
          # app/src/test contains only JVM unit/Compose tests and is never packaged.
          # The exact-head Reforge debug/release unit and lint gate remains required.
          # Keep all app main/androidTest sources, resources and build inputs checked.
          git diff --exit-code "$source_sha" HEAD -- app rules build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat ':(exclude)app/src/test/**'
          # A newer exact-head test run may cancel the source run immediately after
          # its APK build. Allow its always-upload step to finish, then download once.
          astravar_artifact_deadline=$((SECONDS + 180))
          astravar_artifact_ready=0
          while (( SECONDS < astravar_artifact_deadline )); do
            astravar_artifact_count=$(timeout 10s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "android-verification" and .expired == false)] | length')
            if [[ "$astravar_artifact_count" == '1' ]]; then
              astravar_artifact_ready=1
              break
            fi
            sleep 5
          done
          test "$astravar_artifact_ready" = 1
          timeout -k 5s 60s gh run download "$REUSE_RUN_ID" --name android-verification --dir reused-product
          mkdir -p app/build/outputs/apk/release app/build/outputs/apk/debug app/build/outputs/apk/androidTest/debug validation
          cp reused-product/app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/
          # The large-campaign/recovery stage runs the debug instrumentation APK
          # as well. Both files are covered by the unchanged app/build-input gate.
          cp reused-product/app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/
          cp reused-product/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app/build/outputs/apk/androidTest/debug/
          printf 'Product APK reused without modification from run %s\n' "$REUSE_RUN_ID" > validation/product-provenance.txt
          sha256sum app/build/outputs/apk/release/app-release.apk >> validation/product-provenance.txt
          chmod +x gradlew
          timeout -k 10s 210s ./gradlew --console=plain --build-cache --profile :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
      - name: Native authorization upgrade, Notion import and independent campaign readback
        if: env.GENESIS_GATE == 'true'
        timeout-minutes: 25
        env:
          ASTRAVAR_BOOTSTRAP_GATE: 'true'
          ASTRAVAR_VERSION_CODE: ${{ env.EXPECTED_VERSION_CODE }}
        run: timeout -k 10s 1440s bash scripts/ci-owner-hp-native.sh
      - name: Ordered release UI, import, recovery and in-place update on Android 16
        if: env.INVENTORY_BETA != 'true'
        timeout-minutes: 90
        env:
          ASTRAVAR_TEST_APK: app/build/outputs/apk/release/app-release.apk
          ASTRAVAR_TEST_PACKAGE: com.yazsras.astravar
        run: timeout -k 10s 5100s bash scripts/ci-emulator.sh
      - name: Summarize executed tests
        if: always()
        run: python3 scripts/ci-test-summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/outputs/apk/release/*.apk
            overlay-target/build/outputs/apk/**/*.apk
            build/reports/profile/
            app/build/reports/
            rules/build/reports/
            app/build/test-results/
            rules/build/test-results/
            validation/
          retention-days: 14

      - name: Verify and name Astravar 2.0 Stat Test APK
        if: success() && (github.head_ref == 'feat/astravar-2.0-ui-rebuild' || github.ref_name == 'feat/astravar-2.0-ui-rebuild')
        run: |
          mkdir -p validation
          cp app/build/outputs/apk/debug/app-debug.apk validation/Astravar-2.0-Stat-Test-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs validation/Astravar-2.0-Stat-Test-debug.apk > validation/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 validation/Astravar-2.0-Stat-Test-debug.apk > validation/apk-alignment.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging validation/Astravar-2.0-Stat-Test-debug.apk > validation/apk-badging.txt
          python3 scripts/verify_branding.py --badging validation/apk-badging.txt --package com.yazsras.astravar.v2statdebug --version-name 2.0.2-remote-stat-test --version-code 23
          sha256sum validation/Astravar-2.0-Stat-Test-debug.apk > validation/SHA256SUMS.txt
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success() && (github.head_ref == 'feat/astravar-2.0-ui-rebuild' || github.ref_name == 'feat/astravar-2.0-ui-rebuild')
        with:
          name: Astravar-2.0-Stat-Test-apk
          path: |
            validation/Astravar-2.0-Stat-Test-debug.apk
            validation/SHA256SUMS.txt
            validation/SOURCE_COMMIT.txt
            validation/apk-*.txt
          retention-days: 14
