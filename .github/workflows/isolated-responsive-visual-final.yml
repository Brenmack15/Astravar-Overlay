name: Verify responsive retained Inventory
on:
  push:
    branches: [verification/ascension-responsive-visual-final-20261127]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARCHIVE_RUN: '45923727140'
      ARCHIVE_ID: '15166880758'
      PRODUCT_SOURCE: '5e65a4c7052fe1697cbcbd03f415b85249d09b7a'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Link synthetic verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=responsive-retained-visual-final -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Running the original retained visual journey' --silent
      - name: Recover the exact disposable test packages and archived resource observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARCHIVE_ID"
          test "$(gh api "$base" --jq '.workflow_run.id')" = "$ARCHIVE_RUN"
          test "$(gh api "$base" --jq '.workflow_run.head_sha')" = "$PRODUCT_SOURCE"
          test "$(gh api "$base" --jq '.name')" = android-verification
          git diff --exit-code 5bdc05e3e2333970484fce94f0d674f70c236a3d HEAD -- app rules overlay-target build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat scripts/ci-emulator.sh scripts/genesis-upgrade-readback.py
          gh api "$base/zip" >"$RUNNER_TEMP/scoped-artifact.zip"
          echo "f69a63624470085a805790ce7831e99134f10e160d974ca60af90759f19cd4d1  $RUNNER_TEMP/scoped-artifact.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          output = Path("validation")
          output.mkdir(exist_ok=True)
          with ZipFile(Path(os.environ["RUNNER_TEMP"]) / "scoped-artifact.zip") as archive:
              names = set(archive.namelist())
              assert archive.read("validation/SOURCE_COMMIT.txt").decode().strip() == os.environ["PRODUCT_SOURCE"]
              paths = ["app/build/outputs/apk/release/app-release.apk","app/build/outputs/apk/debug/app-debug.apk","app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"]
              paths += [f"validation/upgrade-baseline/code{code}-ci.apk" for code in (49,50,54,56,57,58)]
              for name in paths:
                  contents = archive.read(name)
                  assert 65536 < len(contents) < 100000000
                  dest = Path(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(contents)
                  print("Frozen disposable package", name, hashlib.sha256(contents).hexdigest())
              failure_path = "validation/emulator-evidence/failure-GenesisUpgradeInstrumentationTest-verifyAfterUpgrade.xml"
              matching = [name for name in names if name.endswith("/failure-GenesisUpgradeInstrumentationTest-verifyAfterUpgrade.xml")]
              assert matching == [failure_path], matching
              xml = ET.fromstring(archive.read(failure_path))
              package = "com.yazsras.astravar"
              expected = {"Resources","Genesis Legacy Retention Charges","Genesis Legacy Retention Actor","2 / 5","2/5","2/5 remaining","Limited uses","Use one","Edit"}
              observations = []
              for node in xml.iter("node"):
                  if node.get("package") == package:
                      for att in ("text","content-desc"):
                          value = node.get(att, "")
                          if value in expected:
                              observations.append((att,value,node.get("bounds")))
              print("Archived original code 59 resource screen", json.dumps(observations))
              assert ("text","Genesis Legacy Retention Charges") in [row[:2] for row in observations]
              assert all(("text", value) not in [row[:2] for row in observations] for value in ["2 / 5"])
              assert any(value == "2/5 remaining" for _,value,_ in observations)
              (output/"archived-counter.json").write_text(json.dumps(observations, indent=2))
          PY
      - name: Inspect the two archived synthetic controls on their original failed screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY/actions/artifacts/15169480338"
          test "$(gh api "$api" --jq .workflow_run.id)" = 45930254901
          test "$(gh api "$api" --jq .workflow_run.head_sha)" = 8372986c62a7bb3707af345f28878e452ffbe52a
          test "$(gh api "$api" --jq .name)" = remaining-android16-journeys
          gh api "$api/zip" > "$RUNNER_TEMP/previous-scoped-diagnostic.zip"
          echo "e64264a44dfb4a15f890cc6b11f74a5aa5880546e09868d25ffc072119274efd  $RUNNER_TEMP/previous-scoped-diagnostic.zip" | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          results={}
          cases=(
              ("VisualRebirthJourneyInstrumentationTest-resourcesCompanionGearJournalAndLargeText", {"2/3","2/3 remaining","2 / 3","CI Native Charges"}),
              ("PlayerFirstJourneyInstrumentationTest-characterAdvancementReviewedEquipmentCompanionAndRestart", {"Custom roll · 13","13","Validate entered dice","Save roll"}),
          )
          with ZipFile(Path(os.environ["RUNNER_TEMP"])/"previous-scoped-diagnostic.zip") as archive:
              for stage, controls in cases:
                  expected="emulator-evidence/failure-"+stage+".xml"
                  names=[name for name in archive.namelist() if name==expected or name=="validation/"+expected]
                  assert len(names)==1, (stage,names)
                  contents=archive.read(names[0])
                  found=[]
                  for node in ET.fromstring(contents).iter("node"):
                      if node.get("package") == "com.yazsras.astravar":
                          found.extend((field,node.get(field)) for field in ("text","content-desc") if node.get(field) in controls)
                  results[stage]={"observed":found,"sha256":hashlib.sha256(contents).hexdigest()}
          Path("validation/archived-journey-controls.json").write_text(json.dumps(results,indent=2))
          print("Original synthetic controls",json.dumps(results,sort_keys=True))
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Prepare the stock Android 16 emulator
        run: |
          bash scripts/ci-android-sdk.sh native
          sudo apt-get -qq update
          sudo apt-get -qy install libpulse0
      - name: Verify ordinary APK certificates and build current overlay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools" / "35.0.0"
          expected_cert = None
          for code in (49,50,54,56,57,58,59):
              path = Path("app/build/outputs/apk/release/app-release.apk") if code == 59 else Path(f"validation/upgrade-baseline/code{code}-ci.apk")
              info = subprocess.check_output([str(tools/"aapt"),"dump","badging",str(path)], text=True).splitlines()[0]
              assert f"package: name='com.yazsras.astravar' versionCode='{code}'" in info
              sig = subprocess.check_output([str(tools/"apksigner"),"verify","--print-certs",str(path)], text=True)
              cert = re.search(r"(?m)^Signer #1 certificate SHA-256 digest: ([a-f0-9]{64})$", sig).group(1)
              assert cert != "4c5cb0113cae5d0dee2619ee30f5b3c593d4aa897e1fa38dee7ed5561ec4e847"
              expected_cert = expected_cert or cert
              assert cert == expected_cert, "Matched disposable certificate required"
              print("Verified test-only package", code)
          PY
          # The instrumentation module declares only AGP and Kotlin Android. Its
          # immutable source and matching module build file also work as a stand-
          # alone Gradle project when an unrelated project-level KSP lookup fails.
          if ! bash gradlew --console=plain --build-cache :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest; then
            project="$RUNNER_TEMP/retained-overlay-only"
            mkdir -p "$project/overlay-target"
            cp -r overlay-target/src overlay-target/build.gradle.kts "$project/overlay-target/"
            cp gradle.properties "$project/"
            python3 - "$project" <<'PY'
          from pathlib import Path
          import sys
          sandbox = Path(sys.argv[1])
          source = Path("build.gradle.kts").read_text().splitlines()
          keep = [line for line in source if 'id("com.android.application")' in line or 'kotlin("android")' in line]
          assert len(keep) == 2 and all("version" in line for line in keep)
          (sandbox/"build.gradle.kts").write_text("plugins {\n"+"\n".join(keep)+"\n}\n")
          settings = Path("settings.gradle.kts").read_text()
          all_modules = 'include(":rules", ":app", ":overlay-target")'
          assert settings.count(all_modules) == 1
          (sandbox/"settings.gradle.kts").write_text(settings.replace(all_modules,'include(":overlay-target")'))
          PY
            bash gradlew --console=plain --build-cache --project-dir "$project" :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
            mkdir -p overlay-target/build/outputs
            cp -r "$project/overlay-target/build/outputs/apk" overlay-target/build/outputs/
          fi
      - name: Build the exact optimized source with a disposable certificate and verify historical payloads
        timeout-minutes: 40
        run: |
          set -euo pipefail
          export ASTRAVAR_KEYSTORE="$RUNNER_TEMP/ci-test-only.p12"
          export ASTRAVAR_STORE_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_ALIAS=astravar-ci
          keytool -genkeypair -noprompt -keystore "$ASTRAVAR_KEYSTORE" -storetype PKCS12 -storepass "$ASTRAVAR_STORE_PASSWORD" -keypass "$ASTRAVAR_KEY_PASSWORD" -alias "$ASTRAVAR_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Astravar CI test only'
          trap 'rm -f "$ASTRAVAR_KEYSTORE"' EXIT
          old_product="$RUNNER_TEMP/retained-frozen.apk"
          mv app/build/outputs/apk/release/app-release.apk "$old_product"
          bash gradlew --console=plain --build-cache :app:assembleRelease
          python3 scripts/inspect_release_apk.py app/build/outputs/apk/release/app-release.apk --sdk "$ANDROID_HOME" --package com.yazsras.astravar --version-name 4.1.0 --version-code 59 --output validation/test-package.json
          python3 - <<'PY'
          import os, runpy, subprocess
          from pathlib import Path
          h = runpy.run_path("scripts/ci-baseline.py")
          tools = Path(os.environ["ANDROID_HOME"])/"build-tools"/"35.0.0"
          candidate = Path("app/build/outputs/apk/release/app-release.apk")
          cert = h["require_ci_signer"](candidate,tools)
          prior,_ = h["certificate"](Path(os.environ["RUNNER_TEMP"])/"retained-frozen.apk",tools)
          assert cert != prior
          for code in (49,50,54,56,57,58):
              source = Path(f"validation/upgrade-baseline/code{code}-ci.apk")
              original,_ = h["certificate"](source,tools)
              assert original == prior
              target = source.with_name(f"disposable-{code}.apk")
              subprocess.run([str(tools/"apksigner"),"sign","--ks",os.environ["ASTRAVAR_KEYSTORE"],"--ks-key-alias","astravar-ci","--ks-pass","env:ASTRAVAR_STORE_PASSWORD","--key-pass","env:ASTRAVAR_KEY_PASSWORD","--out",str(target),str(source)],check=True)
              assert h["payload_entries"](source)==h["payload_entries"](target)
              assert h["certificate"](target,tools)[0]==cert
              target.replace(source)
          PY
      - name: Retain the tested overlay pair for subsequent same-input diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-overlay-android16
          path: overlay-target/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Recreate the retained fixture, run the complete visual journey, and read the stopped actor
        timeout-minutes: 53
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRAVAR_BASELINE_APK: validation/upgrade-baseline/code49-ci.apk
          ASTRAVAR_GENESIS_BASELINE_APK: validation/upgrade-baseline/code50-ci.apk
          ASTRAVAR_CONVERGENCE_BASELINE_APK: validation/upgrade-baseline/code54-ci.apk
          ASTRAVAR_TEST_PACKAGE: com.yazsras.astravar
          ASTRAVAR_TEST_APK: app/build/outputs/apk/release/app-release.apk
          EXPECTED_VERSION_CODE: '59'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          original = Path("scripts/ci-emulator.sh").read_text()
          begin = 'if [ -n "${ASTRAVAR_BASELINE_APK:-}" ]; then'
          end = "# Collect independent roll, SQLite and player journeys once before dependent"
          assert original.count(begin) == 1 and original.count(end) == 1
          preamble, _, rest = original.partition(begin)
          historical, _, tail = rest.partition(end)
          assert 'run_stage OverlayInstrumentationTest 3 420 native-baseline-overlay.txt 49' in historical
          assert 'run_stage GenesisUpgradeInstrumentationTest#seedCode49 1 720 native-genesis-upgrade-seed.txt' in historical
          assert "GenesisUpgradeInstrumentationTest#canonicalWriteSurvivesRestart" in historical
          assert "dMappedCampaignRecordsRollbackAfterReadback" in tail and "genesis-crafting-readback.py" in tail
          setup = r'''
          run_stage OverlayInstrumentationTest 3 420 native-baseline-overlay.txt 49
          run_stage GenesisUpgradeInstrumentationTest#seedCode49 1 720 native-genesis-upgrade-seed.txt
          stop_product
          timeout 15s adb -s "$astravar_serial" root
          timeout 15s adb -s "$astravar_serial" wait-for-device
          copy_upgrade_stores validation/remaining-seeded
          python3 scripts/genesis-upgrade-readback.py validation/remaining-seeded --synthetic-emulator --expected-room-schema 9 --output validation/remaining-seeded.json
          for retained_code in 50 54 56 57 58; do
              frozen_apk="validation/upgrade-baseline/code${retained_code}-ci.apk"
              timeout 45s adb -s "$astravar_serial" install -r "$frozen_apk"
              timeout 25s adb -s "$astravar_serial" shell am start -W -n "$astravar_product/com.yazsras.astravar.MainActivity"
              stop_product
          done
          timeout 45s adb -s "$astravar_serial" install -r "$astravar_apk"
          run_stage GenesisUpgradeInstrumentationTest#verifyAfterUpgrade 1 360 remaining-precondition-code59.txt
          stop_product
          copy_upgrade_stores validation/remaining-precondition
          python3 scripts/genesis-upgrade-readback.py validation/remaining-precondition --synthetic-emulator --expected-room-schema 9 --compare validation/remaining-seeded.json --output validation/remaining-precondition.json
          run_stage GenesisUpgradeInstrumentationTest#canonicalWriteSurvivesRestart 1 240 remaining-precondition-heal.txt
          stop_product
          copy_upgrade_stores validation/remaining-start
          python3 scripts/genesis-upgrade-readback.py validation/remaining-start --synthetic-emulator --expected-room-schema 9 --verify-write validation/remaining-precondition.json --output validation/remaining-start.json
          '''
          player = "run_stage PlayerFirstJourneyInstrumentationTest 1 1050 native-player-first.txt"
          visual = "run_stage VisualRebirthJourneyInstrumentationTest 1 900 native-visual-rebirth.txt"
          assert player in tail and visual in tail
          scoped = r'''
          result=0
          PLAYER_FIXTURE
          VISUAL_JOURNEY || result=1
          stop_product
          copy_campaign_database validation/visual-cold
          python3 scripts/qa-visual-resource-readback.py --synthetic-emulator validation/visual-cold/astravar-campaign-ledger.db | tee validation/visual-resource-readback.json || result=1
          test "$result" = 0
          '''
          location = Path(os.environ["RUNNER_TEMP"])/"remaining-journeys.sh"
          location.write_text(preamble + setup + scoped.replace("PLAYER_FIXTURE", player).replace("VISUAL_JOURNEY", visual))
          PY
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from pathlib import Path
          env = os.environ.copy()
          env.pop("GH_TOKEN",None)
          env.pop("GITHUB_TOKEN",None)
          result = subprocess.Popen(["bash",os.environ["RUNNER_TEMP"]+"/remaining-journeys.sh"],env=env)
          states = Path("validation/native-stages.tsv")
          seen = 0
          def post(line):
              status,stage,name = line.split("\t")
              if status not in ("PASS","FAIL") or not re.fullmatch(r"[A-Za-z0-9#]+",stage) or not re.fullmatch(r"[a-zA-Z0-9_.-]+\.txt",name): return
              description=status+" "+stage
              if status == "FAIL" and Path("validation",name).exists():
                  stderr = Path("validation",name).read_text(errors="replace")
                  stack = re.search(r"INSTRUMENTATION_STATUS: stack=([^\n]+)",stderr)
                  if stack: description += " "+stack.group(1).split(": ",1)[-1]
              subprocess.run(["gh","api","-X","POST","/repos/"+os.environ["GITHUB_REPOSITORY"]+"/statuses/"+os.environ["GITHUB_SHA"],"-f","state="+("success" if status=="PASS" else "failure"),"-f","context=journey/"+name.removesuffix(".txt"),"-f","target_url="+os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],"-f","description="+description[:137],"--silent"],check=False)
          while True:
              if states.exists():
                  lines=states.read_text().splitlines()
                  for line in lines[seen:]:
                      if line.count("\t")==2:post(line)
                  seen=len(lines)
              code=result.poll()
              if code is not None:break
              time.sleep(8)
          raise SystemExit(code)
          PY
          cat validation/native-stages.tsv
      - name: Inventory and Chronicle screenshot evidence from the synthetic application
        if: always()
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          from xml.etree import ElementTree as ET
          out = Path("validation")
          evidence = out/"emulator-evidence"
          checkpoints = {}
          for path in sorted(evidence.glob("rebirth-*.png")):
              raw = path.read_bytes()
              assert raw[:8] == b"\x89PNG\r\n\x1a\n"
              checkpoints[path.name] = struct.unpack(">II",raw[16:24])
          info = {"screenshots":checkpoints}
          fail = evidence/"rebirth-failure-before-display-reset.xml"
          if fail.exists():
              rows = []
              for node in ET.parse(fail).iter("node"):
                  if node.get("package") == "com.yazsras.astravar":
                      rows.extend((field,node.get(field),node.get("bounds")) for field in ("text","content-desc") if node.get(field))
              info["failingControls"] = rows
              info["emulatorDisplay"] = (evidence/"rebirth-failure-before-display-reset.txt").read_text()
          states = (out/"native-stages.tsv").read_text() if (out/"native-stages.tsv").exists() else ""
          if "PASS\tVisualRebirthJourneyInstrumentationTest\t" in states:
              for scale in ("1.0","1.3","2.0"):
                  for view in ("character","character-actions","spellbook","party-inventory","inventory","campaign"):
                      assert checkpoints[f"rebirth-{view}-font-{scale}.png"] == (1080,2400)
              assert (out/"visual-resource-readback.json").is_file()
          (out/"visual-journey-evidence.json").write_text(json.dumps(info,indent=2)+"\n")
          print(json.dumps(info))
          PY
      - name: Retain scoped synthetic acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsive-final-android16
          path: |
            validation/RELEASE-UI-RESULT.txt
            validation/remaining-start.json
            validation/archived-counter.json
            validation/archived-journey-controls.json
            validation/visual-journey-evidence.json
            validation/test-package.json
            validation/emulator-evidence/rebirth-*.png
            validation/emulator-evidence/rebirth-failure-before-display-reset.*
            validation/native-stages.tsv
            validation/*-result.json
            validation/*-readback.json
            validation/native-*.txt
            validation/emulator-evidence/failure-*.xml
            validation/emulator-evidence/failure-*.png
            validation/emulator-evidence/rebirth-resource-persistence.png
            validation/emulator-evidence/player-first-roll-history-breakdown.png
            validation/emulator-evidence/genesis-upgrade-companion.png
            validation/emulator-evidence/genesis-after-code59-sheet.png
            validation/emulator-evidence/genesis-canonical-write-after-restart.png
          if-no-files-found: warn
          retention-days: 7
      - name: Record private synthetic acceptance status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATE: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATE" = success ]; then state=success; fi
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=responsive-retained-visual-final -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -f description='Retained visual journey and cold read complete' --silent

  geometry:
    name: Check the original and repaired large-text control
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - uses: ./.github/actions/robolectric-runtime
      - name: Prepare the pinned Android test runtime
        run: bash scripts/ci-android-sdk.sh
      - name: Measure the exact original layout
        shell: bash
        run: |
          set -euo pipefail
          layout='app/src/main/java/com/yazsras/astravar/ui/GenesisInventoryHub.kt'
          git show 6e3ea597ecab1e42fad481898be83f0e7677408d:"$layout" >"$layout"
          mkdir -p validation/geometry-baseline
          case='com.yazsras.astravar.ui.GenesisInventoryHubUiTest.enlargedPartyControlsAndHoldingsShareAnAccessibleScrollSurface'
          result=0
          bash gradlew --console=plain --build-cache :app:testDebugUnitTest --rerun --tests "$case" || result=$?
          report=app/build/test-results/testDebugUnitTest/TEST-com.yazsras.astravar.ui.GenesisInventoryHubUiTest.xml
          test -s "$report"
          cp "$report" validation/geometry-baseline/report.xml
          python3 - "$report" "$result" <<'PY'
          from xml.etree import ElementTree as ET
          import sys
          root=ET.parse(sys.argv[1]).getroot()
          cases=root.findall("testcase")
          assert len(cases)==1 and cases[0].get("name")=="enlargedPartyControlsAndHoldingsShareAnAccessibleScrollSurface"
          print(root.findtext("system-out"))
          failure=cases[0].find("failure")
          if int(sys.argv[2]):
              assert failure is not None, "A build failure cannot establish original UI behavior"
              explanation = failure.get("message", "")
              print(explanation)
              assert "A full item touch target must fit" in explanation or "full 48dp source control" in explanation or "ScrollBy" in explanation, explanation
          else: print("The original 400dp Robolectric viewport opened its primary control.")
          PY
          git restore -- "$layout"
      - name: Verify the repaired lookup and existing party inventory routes
        run: |
          set -euo pipefail
          bash gradlew --console=plain --build-cache :app:testDebugUnitTest --rerun --tests 'com.yazsras.astravar.ui.GenesisInventoryHubUiTest' --tests 'com.yazsras.astravar.ui.GenesisInventoryNavigationUiTest'
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          from pathlib import Path
          for name,count in (("GenesisInventoryHubUiTest",5),("GenesisInventoryNavigationUiTest",1)):
              root=ET.parse(Path("app/build/test-results/testDebugUnitTest")/("TEST-com.yazsras.astravar.ui."+name+".xml")).getroot()
              assert root.get("tests")==str(count) and all(root.get(k)=="0" for k in ("failures","skipped","errors"))
              print(name,count,root.findtext("system-out"))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsive-inventory-layout-evidence
          path: |
            validation/geometry-baseline/report.xml
            app/build/test-results/testDebugUnitTest/TEST-*GenesisInventory*.xml
          retention-days: 7
