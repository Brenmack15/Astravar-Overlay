name: Astravar 3.0 Reforge verification
on:
  push:
    branches: ['feat/astravar-3.0-reforge']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astravar-30-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.head_ref == 'feat/astravar-3.0-reforge' || github.ref_name == 'feat/astravar-3.0-reforge'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Authenticated bridge protocol regression
        run: node --test backend/owner-bridge/*.test.mjs
      - name: Install pinned Android build tools
        timeout-minutes: 8
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/astravar-30-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --connect-timeout 15 --max-time 150 -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/astravar-30-sdk.zip"
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$RUNNER_TEMP/astravar-30-sdk.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/astravar-30-sdk.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf 'y\n%.0s' {1..100} | timeout -k 5s 60s sdkmanager --licenses >/dev/null
          timeout -k 10s 300s sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Verify migration boundaries and retained provenance
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_v2_protected_source.py
          python3 scripts/verify_ui_foundation.py
          python3 scripts/verify_upgrade_integrity.py
          python3 scripts/verify_branding.py
          python3 scripts/verify_particle_resources.py
      - name: Rules, Room, native Compose, lint and debug APK
        timeout-minutes: 42
        run: |
          bash gradlew --no-daemon --console=plain :rules:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug -PastravarScreenshots="$GITHUB_WORKSPACE/validation/reforge-screenshots"
      - name: Inspect actual QA package
        run: |
          mkdir -p validation
          python3 scripts/reforge_inspect_apk.py app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME" --output validation/reforge-debug-package.json
          python3 scripts/reforge_evidence.py --output validation/reforge-evidence.json
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
          printf '%s\n' 'DEBUG QA ARTIFACT. This is not an owner-signed in-place update. No production release, signing rotation or physical phone installation occurred.' > validation/QA-ONLY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-3.0-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            rules/build/reports/
            app/build/test-results/
            rules/build/test-results/
            validation/
          retention-days: 14
