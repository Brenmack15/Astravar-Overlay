name: Astravar Reforge verification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astravar-30-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GENESIS_GATE: 'true'
      EXPECTED_VERSION_NAME: '4.0.0-unification1'
      EXPECTED_VERSION_CODE: '52'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Authenticated bridge protocol regression
        run: node --test backend/owner-bridge/*.test.mjs
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.ref_name != github.event.repository.default_branch && github.event_name != 'workflow_dispatch' }}
      - name: Use installed Android packages
        timeout-minutes: 9
        run: bash scripts/ci-android-sdk.sh
      - name: Verify migration boundaries and retained provenance
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_v2_protected_source.py
          python3 scripts/verify_ui_foundation.py
          python3 scripts/verify_upgrade_integrity.py
          python3 scripts/verify_branding.py
          python3 scripts/verify_particle_resources.py
      - name: Player journey smoke tests before the full suite
        # Genesis runs every test once in the full gate below.
        if: env.GENESIS_GATE != 'true'
        timeout-minutes: 20
        run: |
          bash gradlew --console=plain --build-cache :app:testDebugUnitTest \
            --tests 'com.yazsras.astravar.ui.NavigationV2Test' \
            --tests 'com.yazsras.astravar.ui.PrimaryNavigationLayoutTest' \
            --tests 'com.yazsras.astravar.ui.CampaignVisualAcceptanceTest' \
            --tests 'com.yazsras.astravar.ui.ReforgeCharacterUiTest' \
            --tests 'com.yazsras.astravar.ui.ReforgeCampaignConnectionsTest' \
            --tests 'com.yazsras.astravar.data.ReforgeCampaignIdentityTest' \
            --tests 'com.yazsras.astravar.ui.PartyPlayerFirstTest' \
            --tests 'com.yazsras.astravar.ui.ConnectionsPageV2Test' \
            --tests 'com.yazsras.astravar.ui.CampaignBackupUiSafetyTest' \
            --tests 'com.yazsras.astravar.ui.CampaignArchiveUiV21Test' \
            --tests 'com.yazsras.astravar.ui.StorageRecoveryPanelTest' \
            --tests 'com.yazsras.astravar.data.ReforgeItemTransferTest' \
            --tests 'com.yazsras.astravar.data.CompanionCreationTest' \
            --tests 'com.yazsras.astravar.data.CampaignSyncDomainTest' \
            --tests 'com.yazsras.astravar.data.CampaignConnectionProjectionTest' \
            --tests 'com.yazsras.astravar.data.ReforgeLargeCampaignSelectionTest'
      - name: Rules and debug Room/Compose regressions
        timeout-minutes: 45
        run: |
          bash gradlew --console=plain --build-cache --continue :rules:test :app:testDebugUnitTest -PastravarScreenshots="$GITHUB_WORKSPACE/validation/reforge-screenshots"
      - name: Release regressions, lint and debug APK
        # Do not spend the release/lint budget after a known debug regression.
        # Every task remains required before this workflow can pass.
        if: success()
        timeout-minutes: 45
        run: |
          bash gradlew --console=plain --build-cache --continue :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug -PastravarScreenshots="$GITHUB_WORKSPACE/validation/reforge-screenshots"
      - name: Inspect actual QA package
        run: |
          mkdir -p validation
          python3 scripts/reforge_inspect_apk.py app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME" --version-code "$EXPECTED_VERSION_CODE" --version-name "$EXPECTED_VERSION_NAME" --output validation/reforge-debug-package.json
          printf '%s\n' 'DEBUG QA ARTIFACT. This is not an owner-signed in-place update. No production release, signing rotation or physical phone installation occurred.' > validation/QA-ONLY.txt
      - name: Index executed evidence even on failure
        if: always()
        run: |
          mkdir -p validation
          python3 scripts/ci-test-summary.py
          python3 scripts/reforge_evidence.py --output validation/reforge-evidence.json
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-3.0-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            rules/build/reports/
            app/build/test-results/
            rules/build/test-results/
            validation/
          retention-days: 14
