name: Astravar 2.1 native verification
on:
  push:
    branches: ['feat/astravar-2.1-player-first']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # One full run per pushed development head; manual runs use the same queue.
  group: "astravar-21-${{ github.ref_name }}${{ github.event_name == 'push' && github.event.head_commit.message == 'ci: run verified native code32 harness recheck' && '-native32-harness-only' || '' }}"
  cancel-in-progress: true
jobs:
  verify:
    # The strict immutable-product native workflow covers this exact test-only subject.
    if: >-
      github.event_name != 'push' || github.event.head_commit.message != 'ci: run verified native code32 harness recheck'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASTRAVAR_VERSION_NAME: '2.1.0'
      ASTRAVAR_VERSION_CODE: '33'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Verify the exact pushed or manually selected source commit.
          ref: ${{ github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install checksum-verified SDK and accelerated emulator
        timeout-minutes: 9
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --connect-timeout 15 --max-time 150 -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          echo '7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  '"$RUNNER_TEMP/android-cli.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/19.0"
          export PATH="$ANDROID_HOME/cmdline-tools/19.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf 'y\n%.0s' {1..100} | timeout -k 5s 60s sdkmanager --licenses >/dev/null
          # Both attempts share the original single 360s package-install budget.
          # Keep logs outside validation until prepare has created that directory.
          mkdir -p "$RUNNER_TEMP/astravar-sdk-install-logs"
          timeout -k 10s 360s bash <<'ASTRAVAR_SDK_INSTALL'
          set -e
          for astravar_sdk_attempt in 1 2; do
            set +e
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'platform-tools' 'system-images;android-36;google_apis;x86_64' 2>&1 | tee "$RUNNER_TEMP/astravar-sdk-install-logs/attempt-$astravar_sdk_attempt.log"
            astravar_sdk_pipeline_status=("${PIPESTATUS[@]}")
            set -e
            astravar_sdk_status=${astravar_sdk_pipeline_status[0]}
            printf 'attempt=%s sdkmanager_exit=%s log_exit=%s\n' "$astravar_sdk_attempt" "$astravar_sdk_status" "${astravar_sdk_pipeline_status[1]}" >> "$RUNNER_TEMP/astravar-sdk-install-logs/results.log"
            if test "${astravar_sdk_pipeline_status[1]}" -ne 0; then exit "${astravar_sdk_pipeline_status[1]}"; fi
            if test "$astravar_sdk_status" -eq 0; then exit 0; fi
            if test "$astravar_sdk_attempt" -eq 1; then
              # Only the incomplete installer cache in this fresh job's SDK.
              test "$ANDROID_HOME" = "$RUNNER_TEMP/android-sdk"
              rm -rf -- "$ANDROID_HOME/.temp"
            fi
          done
          exit "$astravar_sdk_status"
          ASTRAVAR_SDK_INSTALL
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/19.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Python, source provenance and artwork integrity
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/verify_v2_protected_source.py
          python3 scripts/verify_ui_foundation.py
          python3 scripts/verify_branding.py
          python3 scripts/verify_particle_resources.py
          python3 scripts/verify_upgrade_integrity.py
      - name: Rules, Android regressions, release lint and optimized APK
        # Build the exact schema-3 source baseline and final schema-4 source with one
        # disposable signer. This proves the real additive upgrade, not merely
        # reinstalling the same source under a higher version code.
        timeout-minutes: 40
        run: |
          chmod +x gradlew
          # Deliberately ephemeral, public test-only credentials. This does not
          # replace, rotate, recover or certify the historical owner signing key.
          export ASTRAVAR_KEYSTORE="$RUNNER_TEMP/ci-test-only.p12"
          export ASTRAVAR_STORE_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_PASSWORD=temporary-ci-only
          export ASTRAVAR_KEY_ALIAS=astravar-ci
          keytool -genkeypair -noprompt -keystore "$ASTRAVAR_KEYSTORE" -storetype PKCS12 -storepass "$ASTRAVAR_STORE_PASSWORD" -keypass "$ASTRAVAR_KEY_PASSWORD" -alias "$ASTRAVAR_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Astravar CI test only'
          trap 'rm -f "$ASTRAVAR_KEYSTORE"' EXIT
          # The owner key never enters CI. Baseline source is the explicitly
          # verified owner-approved commit; only fictional native fixtures run.
          git fetch --no-tags --depth=1 origin b02222006e631e145194609e248cbb7adf5f21db
          git worktree add --detach "$RUNNER_TEMP/astravar-schema3-baseline" b02222006e631e145194609e248cbb7adf5f21db
          test "$(git -C "$RUNNER_TEMP/astravar-schema3-baseline" rev-parse HEAD)" = b02222006e631e145194609e248cbb7adf5f21db
          (cd "$RUNNER_TEMP/astravar-schema3-baseline" && ASTRAVAR_VERSION_CODE=24 bash ./gradlew --no-daemon --console=plain :app:assembleRelease)
          mkdir -p validation
          cp "$RUNNER_TEMP/astravar-schema3-baseline/app/build/outputs/apk/release/app-release.apk" validation/Astravar-2.1-CI-ONLY-code24.apk
          python3 scripts/inspect_release_apk.py validation/Astravar-2.1-CI-ONLY-code24.apk --package com.yazsras.astravar --version-name 2.1.0 --version-code 24 --output validation/release-code24.json
          ./gradlew --no-daemon --console=plain :rules:test :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest -PastravarScreenshots="$GITHUB_WORKSPACE/validation/screenshots"
          mkdir -p validation
          cp app/build/outputs/apk/release/app-release.apk validation/Astravar-2.1-CI-ONLY-code33.apk
          cp app/build/outputs/apk/debug/app-debug.apk validation/Astravar-2.1-QA-debug.apk
          python3 scripts/inspect_release_apk.py validation/Astravar-2.1-CI-ONLY-code33.apk --package com.yazsras.astravar --version-name 2.1.0 --version-code 33 --output validation/release-code33.json
          python3 scripts/inspect_release_apk.py validation/Astravar-2.1-QA-debug.apk --package com.yazsras.astravar.v2uidebug --version-name 2.1.0-ui-rebuild --version-code 33 --output validation/debug-code33.json
          python3 - <<'PY'
          import json
          a=json.load(open('validation/release-code24.json'))
          b=json.load(open('validation/release-code33.json'))
          assert a['certificate_sha256']==b['certificate_sha256']
          assert b['version_code']>a['version_code']
          assert not a['owner_signature_verified'], 'CI must never use the owner key'
          PY
          git rev-parse HEAD > validation/SOURCE_COMMIT.txt
          sha256sum validation/*.apk > validation/SHA256SUMS.txt
          printf '%s\n' 'CI TEST ONLY. The optimized APK uses a disposable signer, not the permanent owner signing identity. Do not install over an owner-signed app or uninstall an existing app to bypass signature checks. No production release is published.' >validation/CI-ONLY-NOT-A-PERMANENT-RELEASE.txt
      - name: Native overlay, font scaling and in-place update preservation
        timeout-minutes: 30
        run: bash scripts/ci-player-first-emulator.sh
      - name: Preserve SDK package-install attempt diagnostics
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/astravar-sdk-install-logs"; then
            mkdir -p validation/sdk-install
            cp -R "$RUNNER_TEMP/astravar-sdk-install-logs/." validation/sdk-install/
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Astravar-2.1-verification
          path: |
            app/build/reports/
            rules/build/reports/
            app/build/test-results/
            rules/build/test-results/
            app/schemas/
            validation/
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
