name: Isolated original media in-place upgrade
on:
  push:
    branches: [verification/ascension-legacy-media-20261127]
permissions:
  contents: read
  actions: read
  statuses: write
concurrency:
  group: media-upgrade-qa-only
  cancel-in-progress: true
jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Link the isolated run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=qa-legacy-media -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Locate Android tools
        run: bash scripts/ci-android-sdk.sh
      - name: Set up Android 17 and PNG/WebP reader
        run: |
          bash scripts/ci-android17-sdk.sh
          python3 -m venv "$RUNNER_TEMP/qa-img-python"
          "$RUNNER_TEMP/qa-img-python/bin/pip" install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
          echo "$RUNNER_TEMP/qa-img-python/bin" >> "$GITHUB_PATH"
      - name: Witness legacy picker, both installed versions and the same private file across restart
        env: {GH_TOKEN: "${{ github.token }}"}
        run: bash scripts/qa-legacy-media-upgrade.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-native-media-install-proof
          path: validation/legacy-media-upgrade
          retention-days: 14
          if-no-files-found: warn
      - name: Publish measured status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          state=failure
          if [ "$OUTCOME" = success ]; then state=success; fi
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=qa-legacy-media -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
