name: Identify Android 17 accessibility services on the isolated test image
on:
  push:
    branches: ['verification/ascension-aosp-reader-check-20261127']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4aa4cb04e283dd62291a6c685bb7f66f0b724f40
          persist-credentials: false
      - name: Boot an owned Android 17 emulator and paste in a separate package
        shell: bash
        run: |
          set -euo pipefail
          sdkbin=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$sdkbin"
          export PATH="$(dirname "$sdkbin"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sudo chmod a+rw /dev/kvm
          bash scripts/ci-android17-sdk.sh
          qa_sdk="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/sheet-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd=AstravarSheetQA
          serial=emulator-5578
          device() { adb -s "$serial" "$@"; }
          printf 'no\n' | avdmanager create avd -f -n "$avd" -k 'system-images;android-37.0;default;x86_64' --device pixel_6
          "$qa_sdk/emulator/emulator" -avd "$avd" -port 5578 -accel on -no-window -no-audio -no-snapshot -no-boot-anim -memory 4096 -gpu swiftshader > "$RUNNER_TEMP/sheet-emulator.log" 2>&1 &
          qemu_pid=$!
          trap 'kill "$qemu_pid" 2>/dev/null || true' EXIT
          timeout 140 adb -s "$serial" wait-for-device
          for i in $(seq 1 100); do
            kill -0 "$qemu_pid"
            if test "$(device shell getprop sys.boot_completed | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          test "$(device shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$(device shell getprop ro.build.version.sdk | tr -d '\r')" = 37
          test "$(device emu avd name | tr -d '\r' | head -1)" = "$avd"
          mkdir -p validation/sheet
          device shell cmd package query-services --brief -a android.accessibilityservice.AccessibilityService | tr -d '\r' | tee validation/sheet/available-services.txt
          device shell pm list packages -s | tr -d '\r' | sort > validation/sheet/system-apps.txt
          if grep -Eiq '(talkback|marvin|android.accessibilitysuite)' validation/sheet/available-services.txt validation/sheet/system-apps.txt; then
            echo STOCK_READER_FOUND
          else
            echo NO_STOCK_TALKBACK_PACKAGE_ON_DEFAULT_API37
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-api37-stock-accessibility-services
          path: validation/sheet/
