name: Isolated installed preservation acceptance
on:
  push:
    branches: [verification/ascension-preservation-gates-20261127]
concurrency:
  group: isolated-ascension-preservation-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'Preset-only') }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  native:
    if: "!startsWith(github.event.head_commit.message, 'Preset-only') && !startsWith(github.event.head_commit.message, 'Evidence:')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Link the private per-commit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=qa-preservation -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 883198a3140ae2b707b31f81829c94cd821189b9
          path: baseline58
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Locate Android command-line tools
        run: bash scripts/ci-android-sdk.sh
      - name: Install the Android 17 emulator and workerd runtime
        run: |
          bash scripts/ci-android17-sdk.sh
          npm install --prefix "$RUNNER_TEMP/preservation-runtime" --no-audit --no-fund --no-save miniflare@5.20261123.1-beta
          echo "ASTRAVAR_MINIFLARE_PATH=$RUNNER_TEMP/preservation-runtime/node_modules/miniflare" >> "$GITHUB_ENV"
      - name: Build both QA identities with the same ephemeral Android debug signer
        run: |
          (cd baseline58 && ASTRAVAR_VERSION_CODE=58 bash gradlew --console=plain --build-cache :app:assembleDebug)
          ASTRAVAR_VERSION_CODE=59 bash gradlew --console=plain --build-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify actual upgrade, native archive and restored private provider
        run: bash scripts/qa-ascension-preservation-installed.sh
      - name: Retain measured installed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-installed-preservation
          path: validation/preservation-installed
          retention-days: 14
          if-no-files-found: warn
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=qa-preservation -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
  presets:
    if: "!startsWith(github.event.head_commit.message, 'Evidence:')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Link isolated preset verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=qa-preset-evidence -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with: {cache-read-only: true}
      - uses: ./.github/actions/robolectric-runtime
      - run: |
          bash scripts/ci-android-sdk.sh
          npm install --prefix "$RUNNER_TEMP/preservation-runtime" --no-audit --no-fund --no-save miniflare@5.20261123.1-beta
          node scripts/verify-ascension-preset-recovery.cjs "$RUNNER_TEMP/preservation-runtime/node_modules/miniflare"
          bash gradlew --console=plain --build-cache :app:testDebugUnitTest --rerun --tests '*CloudPresetManagementInteropTest' --tests '*CloudPlayableToolsInteropTest' --tests '*AscensionRollManagerTest'
      - name: Inspect individual synthetic outcomes
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          counts=0
          for p in Path('app/build/test-results/testDebugUnitTest').glob('*.xml'):
              for test in ET.parse(p).getroot().findall('testcase'):
                  counts+=1
                  print('Observed native preset case',test.get('name'),test.get('time'))
                  for fail in test.findall('failure'): print((fail.text or '')[:7500])
          print('Observed native total',counts)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-preset-recalculation
          path: app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 14
          if-no-files-found: warn

  evidence:
    if: "startsWith(github.event.head_commit.message, 'Evidence:')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, actions: read, statuses: write}
    steps:
      - name: Verify previously generated synthetic archives and publish the observed counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="/repos/$GITHUB_REPOSITORY/actions/artifacts"
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=qa-preservation-members -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          gh api "$base/15172027891/zip" > "$RUNNER_TEMP/installed.zip"
          gh api "$base/15171734272/zip" > "$RUNNER_TEMP/presets.zip"
          cd "$RUNNER_TEMP"
          echo 'b40565006e96db1093cc2ba9ad76f7085e52c9915ca057b85f8dd6d07507ada0  installed.zip' | sha256sum -c -
          echo '35bc9e4a67f1f107c6da001c096697f7e9cb2286861912a7da1800ab276b079e  presets.zip' | sha256sum -c -
          python3 - <<'PY'
          import hashlib, json, struct, xml.etree.ElementTree as ET, zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile('presets.zip') as archive:
              stats = {'tests':0,'errors':0,'failures':0,'skipped':0}
              for member in archive.namelist():
                  if member.endswith('.xml'):
                      root = ET.fromstring(archive.read(member))
                      for key in stats: stats[key] += int(root.get(key, '0'))
              assert stats == {'tests':8,'errors':0,'failures':0,'skipped':0}, stats
              print('Observed XML',json.dumps(stats))
          with zipfile.ZipFile('installed.zip') as archive:
              index = {PurePosixPath(n).name:n for n in archive.namelist()}
              for m in ['code58-seed','upgraded-archive','restored-forms']:
                  assert 'OK (1 test)' in archive.read(index[m+'.txt']).decode()
              print('Android UID verification:',archive.read(index['uid.txt']).decode().strip())
              for name in ['archive-summary.json','restore-summary.json']:
                  print(name,json.dumps(json.loads(archive.read(index[name])),sort_keys=True))
              capture = ['upgraded-find','upgraded-active-inventory','upgraded-owner-backup','restored-form-header','restored-resource','restored-ordinary-portrait']
              for tag in capture:
                  data=archive.read(index[tag+'.png']);assert data[:8] == bytes.fromhex('89504e470d0a1a0a')
                  dimensions=struct.unpack('>II',data[16:24])
                  assert min(dimensions)>800
                  print('Synthetic screenshot',tag,*dimensions,hashlib.sha256(data).hexdigest())
          PY
          gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=qa-preservation-members -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
