name: Read original code59 retained Inventory before display reset
on:
  push:
    branches: ['verification/ascension-inventory-frame-20261127']
    paths: ['.github/workflows/inspect-code59-inventory-before-reset.yml']
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect pinned synthetic Android 16 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="/repos/$GITHUB_REPOSITORY/actions/artifacts/15171828691"
          test "$(gh api "$api" --jq .workflow_run.id)" = 45933831235
          test "$(gh api "$api" --jq .workflow_run.head_sha)" = 6e3ea597ecab1e42fad481898be83f0e7677408d
          gh api "$api/zip" > "$RUNNER_TEMP/fixture.zip"
          echo "06d1f54782a2e94e9ee7b887bf4487fe3c966f064ae5c9537269c9d56fcb2596  $RUNNER_TEMP/fixture.zip" | sha256sum -c -
          python3 - <<'PY'
          from hashlib import sha256
          import json, os, struct
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          case="VisualRebirthJourneyInstrumentationTest-resourcesCompanionGearJournalAndLargeText"
          with ZipFile(Path(os.environ["RUNNER_TEMP"])/"fixture.zip") as z:
              names=z.namelist()
              def read_single(suffix):
                  hits=[n for n in names if n==suffix or n.endswith("/"+suffix)]
                  assert len(hits)==1,(suffix,hits)
                  return z.read(hits[0])
              xml=read_single("rebirth-failure-before-display-reset.xml")
              settings=read_single("rebirth-failure-before-display-reset.txt").decode()
              print("ORIGINAL WINDOW",json.dumps(settings))
              print("ACTUAL FONT MILESTONES",sorted(n.split("/")[-1] for n in names if "rebirth-" in n and "-font-" in n and n.endswith(".png")))
              failure_png=read_single("rebirth-failure-before-display-reset.png")
              resource=read_single("emulator-evidence/rebirth-resource-persistence.png")
              before_reset=[n for n in names if "rebirth-failure-before-display-reset" in n]
              print("ARCHIVE",json.dumps({"beforeResetMembers":before_reset,"UI_sha256":sha256(xml).hexdigest(),"screen":struct.unpack(">II",failure_png[16:24]),"restarted_resource_sha256":sha256(resource).hexdigest()}))
              assert settings.strip() and len(xml)>500 and failure_png.startswith(bytes.fromhex("89504e47"))
              tree=ET.fromstring(xml)
              parents={n:p for p in tree.iter() for n in p}
              for node in tree.iter("node"):
                  if node.get("package")!="com.yazsras.astravar": continue
                  if node.get("scrollable")=="true" or node.get("class") in ("android.widget.ScrollView","android.widget.HorizontalScrollView"):
                      print("VIEWPORT",node.get("class"),node.get("bounds"),node.get("scrollable"))
                  for attr in ("text","content-desc"):
                      value=node.get(attr)
                      if not value: continue
                      anc=node
                      for _ in range(6):
                          if anc.get("clickable")=="true" or anc.get("selected")=="true" or anc not in parents: break
                          anc=parents[anc]
                      print("CONTROL",json.dumps([attr,value[:130],node.get("bounds"),anc.get("clickable"),anc.get("selected"),anc.get("bounds")]))
              for name in ("native-visual-rebirth.txt",):
                  rows=read_single(name).decode().splitlines()
                  for s in rows:
                      if "VisualRebirthJourneyInstrumentationTest.kt" in s or "Missing product control" in s: print("FAILURE",s[:280])
          PY
