name: Focused Android 17 historical upgrade
on:
  push:
    branches:
      - verification/ascension-api37-upgrade
permissions:
  contents: read
  actions: read
concurrency:
  group: ascension-code58-upgrade-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Prepare the approved build SDK
        run: bash scripts/ci-android-sdk.sh
      - name: Prepare the stable API 37 AOSP system image
        run: bash scripts/ci-android17-sdk.sh
      - name: Verify the exact disposable package pair from the producer run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/artifacts/15166880758"
          gh api "$endpoint" > "$RUNNER_TEMP/qa-upgrade-source.json"
          gh api "$endpoint/zip" > "$RUNNER_TEMP/qa-upgrade-source.zip"
          python3 scripts/qa-ascension-upgrade-inputs.py "$RUNNER_TEMP/qa-upgrade-source.zip" "$RUNNER_TEMP/qa-upgrade-source.json"
      - name: Build the matching overlay app and instrumentation
        run: |
          chmod +x gradlew
          ./gradlew --console=plain --build-cache :overlay-target:assembleDebug :overlay-target:assembleDebugAndroidTest
      - name: Prove the installed package and Room survive the upgrade across light and dark themes
        run: bash scripts/qa-ascension-api37-emulator.sh
      - name: Preserve synthetic package, inspector and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-api37-upgrade-evidence
          path: validation/ascension-api37/
          if-no-files-found: warn
          retention-days: 3
