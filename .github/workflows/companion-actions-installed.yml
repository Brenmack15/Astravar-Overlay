name: Android 17 installed companion attacks and effects
on:
  push:
    branches: ['verification/ascension-companion-actions-api37-20261127']
    paths:
      - '.github/workflows/companion-actions-installed.yml'
      - 'app/src/androidTest/java/com/yazsras/astravar/data/AscensionCompanionActionsNativeTest.kt'
      - 'scripts/ci-ascension-companion-actions.mjs'
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify frozen Android, rules and authoritative service
        run: |
          test "$(git rev-parse HEAD:app/src/main)" = 1c10a77cc8981b406b33b4c2eadfa64624bfab7c
          test "$(git rev-parse HEAD:rules)" = d3a7fa930752a94e2d1a2e9acf8e7b305bbc1f4d
          test "$(git rev-parse HEAD:backend/owner-bridge)" = 4403749da2d5abfc3b5ad610aded05abff82d042
          test "$(git rev-parse HEAD:app/build.gradle.kts)" = cc051113c114f159dd144ed2ec5b57a1186ef869
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          cache-read-only: true
      - name: Locate Android command-line tools
        run: bash scripts/ci-android-sdk.sh
      - name: Install the official API 37 system image
        run: bash scripts/ci-android17-sdk.sh
      - name: Build existing product and instrumented assertions
        run: bash gradlew --console=plain --build-cache :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Play five attack families and source effects on a fresh emulator
        timeout-minutes: 25
        env:
          ASTRAVAR_BASELINE_DEBUG_APK: app/build/outputs/apk/debug/app-debug.apk
          ASTRAVAR_VERSION_CODE: '59'
          ASTRAVAR_BOOTSTRAP_GATE: 'true'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          src=Path('scripts/ci-owner-hp-native.sh').read_text()
          cutoff='timeout 10s adb -s "$astravar_serial" shell dumpsys connectivity >"$astravar_output/connectivity-before-tests.txt"'
          start='# After proving fresh AVD ownership again,'
          end='if [[ "$astravar_bootstrap_gate" == true ]]; then\n  # Each test is mandatory'
          assert all(src.count(mark)==1 for mark in (cutoff,start,end))
          prefix=src.partition(cutoff)[0]
          clock=start+src.partition(start)[2].partition(end)[0]
          assert 'files/ci-https-config.json' in clock and 'verify_owned_emulator()' in prefix
          steps=r'''
          verify_owned_emulator
          node scripts/ci-ascension-cloud-gateway.mjs setup "$astravar_private" > "$astravar_output/companion-initial.json"
          run_test 'com.yazsras.astravar.data.AscensionCloudNativeTest#pairAndCachePreStopState' companion-pairing.txt
          node scripts/ci-ascension-companion-actions.mjs seed "$astravar_private" > "$astravar_output/companion-seed.json"
          adb -s "$astravar_serial" shell "run-as $astravar_product sh -c 'cat >files/companion-instrumented-plan.json'" <"$astravar_private/companion-instrumented-plan.json"
          run_test 'com.yazsras.astravar.data.AscensionCompanionActionsNativeTest#fiveSourceAttacksAndActiveEffectsAcrossADeployedMinute' companion-instrumented.txt 900
          verify_owned_emulator
          adb -s "$astravar_serial" pull "/sdcard/Android/data/$astravar_product/files/ascension-cloud/companion-actions-device.json" "$astravar_output/companion-actions-device.json" >/dev/null
          node scripts/ci-ascension-companion-actions.mjs verify "$astravar_private" "$astravar_output/companion-actions-device.json" > "$astravar_output/companion-actions-verified.json"
          echo "Completed installed companion evidence"
          '''
          Path(os.environ['RUNNER_TEMP'],'native-companion-acceptance.sh').write_text(prefix+clock+'\n'+steps+'\n')
          PY
          bash "$RUNNER_TEMP/native-companion-acceptance.sh"
      - name: Retain synthetic device observations, receipt hashes and frozen product identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-companion-actions-and-effects
          path: validation/owner-hp-native/companion-*
          retention-days: 7
